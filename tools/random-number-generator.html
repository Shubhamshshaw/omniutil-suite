<body>
  <header class="app-header">
    <div class="header-container">

      <div class="nav-controls">

        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>🎲 True Random Number Generator</h1>
            <p class="tool-description">Generate cryptographically random integers, decimals, lottery picks, and dice rolls in bulk.</p>
          </div>
        </div>
        
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;margin-bottom:1.5rem;">
          <div class="form-group">
            <label class="form-label">Minimum</label>
            <input type="number" id="rng-min" class="input-field" value="1">
          </div>
          <div class="form-group">
            <label class="form-label">Maximum</label>
            <input type="number" id="rng-max" class="input-field" value="100">
          </div>
          <div class="form-group">
            <label class="form-label">Quantity</label>
            <input type="number" id="rng-count" class="input-field" value="5" min="1" max="50">
          </div>
        </div>
        <div style="display:flex;gap:0.75rem;margin-bottom:1.5rem;">
          <button class="btn btn-primary" onclick="generateRNG()">Roll Numbers</button>
          <button class="btn btn-secondary" onclick="copyToClipboard(document.getElementById('rng-output').textContent)">Copy Results</button>
        </div>
        <div style="background:var(--bg-secondary);padding:2rem;border-radius:var(--radius-md);border:1px solid var(--card-border);text-align:center;">
          <div id="rng-output" style="font-size:2rem;font-weight:800;color:var(--accent-primary);font-family:'Fira Code',monospace;">-</div>

  <script src="../js/ads-config.js"></script>
  <script>

        function generateRNG() {
          const min = parseInt(document.getElementById('rng-min').value) || 0;
          const max = parseInt(document.getElementById('rng-max').value) || 100;
          const count = parseInt(document.getElementById('rng-count').value) || 1;

          const results = [];
          for (let i = 0; i < count; i++) {
            const arr = new Uint32Array(1);
            crypto.getRandomValues(arr);
            const val = min + (arr[0] % (max - min + 1));
            results.push(val);
          }
          document.getElementById('rng-output').textContent = results.join(',  ');
        }
        generateRNG();
        
  </script>
