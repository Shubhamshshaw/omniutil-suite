<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <meta name="description" content="Design smooth CSS box shadows with interactive sliders for horizontal/vertical offsets, blur, spread radius, and opacity.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="CSS Box Shadow Generator | OmniUtil">
  <meta property="og:description" content="Design smooth CSS box shadows with interactive sliders for horizontal/vertical offsets, blur, spread radius, and opacity.">

  <!-- Google AdSense Verification & Auto ads script -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>🔳 CSS Box Shadow Generator</h1>
            <p class="tool-description">Design smooth CSS box shadows with interactive sliders for horizontal/vertical offsets, blur, spread radius, and opacity.</p>
          </div>
        </div>
        
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem;">
          <div>
            <div class="form-group">
              <label class="form-label">Horizontal Offset: <span id="v-x">0px</span></label>
              <input type="range" id="s-x" min="-50" max="50" value="0" class="input-field" oninput="updateShadow()">
            </div>
            <div class="form-group">
              <label class="form-label">Vertical Offset: <span id="v-y">15px</span></label>
              <input type="range" id="s-y" min="-50" max="50" value="15" class="input-field" oninput="updateShadow()">
            </div>
            <div class="form-group">
              <label class="form-label">Blur Radius: <span id="v-blur">30px</span></label>
              <input type="range" id="s-blur" min="0" max="100" value="30" class="input-field" oninput="updateShadow()">
            </div>
            <div class="form-group">
              <label class="form-label">Spread Radius: <span id="v-spread">0px</span></label>
              <input type="range" id="s-spread" min="-30" max="30" value="0" class="input-field" oninput="updateShadow()">
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
              <div class="form-group">
                <label class="form-label">Shadow Color</label>
                <input type="color" id="s-color" value="#000000" class="input-field" style="height:44px;padding:4px;" oninput="updateShadow()">
              </div>
              <div class="form-group">
                <label class="form-label">Shadow Opacity: <span id="v-op">0.35</span></label>
                <input type="range" id="s-op" min="0" max="1" step="0.05" value="0.35" class="input-field" oninput="updateShadow()">
              </div>
            </div>
          </div>
          <div style="display:flex;align-items:center;justify-content:center;background:var(--bg-secondary);border-radius:var(--radius-md);border:1px solid var(--card-border);padding:2rem;">
            <div id="box-preview" style="width:160px;height:160px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;"></div>
          </div>
        </div>
        <div class="form-group">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
            <label class="form-label">CSS Code</label>
            <button class="btn btn-sm btn-primary" onclick="copyCSS()">Copy CSS</button>
          </div>
          <textarea id="shadow-code" class="textarea-field" style="font-family:'Fira Code',monospace;min-height:70px;" readonly></textarea>
        </div>
        
      </div>
      <aside>
        <div class="ad-unit ad-sidebar">
          <span class="ad-label">Advertisement</span>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="3000000032" data-ad-format="auto"></ins>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
      </aside>
    </div>
  </main>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved. Built for maximum speed, security, and responsive performance.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        function hexToRgba(hex, alpha) {
          const r = parseInt(hex.slice(1, 3), 16);
          const g = parseInt(hex.slice(3, 5), 16);
          const b = parseInt(hex.slice(5, 7), 16);
          return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }
        function updateShadow() {
          const x = document.getElementById('s-x').value;
          const y = document.getElementById('s-y').value;
          const blur = document.getElementById('s-blur').value;
          const spread = document.getElementById('s-spread').value;
          const color = document.getElementById('s-color').value;
          const op = document.getElementById('s-op').value;

          document.getElementById('v-x').textContent = x + 'px';
          document.getElementById('v-y').textContent = y + 'px';
          document.getElementById('v-blur').textContent = blur + 'px';
          document.getElementById('v-spread').textContent = spread + 'px';
          document.getElementById('v-op').textContent = op;

          const rgba = hexToRgba(color, op);
          const css = `box-shadow: ${x}px ${y}px ${blur}px ${spread}px ${rgba};`;
          document.getElementById('box-preview').style.boxShadow = `${x}px ${y}px ${blur}px ${spread}px ${rgba}`;
          document.getElementById('shadow-code').value = css;
        }
        function copyCSS() {
          const val = document.getElementById('shadow-code').value;
          if (val) copyToClipboard(val, 'Box shadow CSS copied!');
        }
        updateShadow();
        
  </script>
</body>
</html>
