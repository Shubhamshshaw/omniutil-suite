  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>📻 NATO Phonetic Alphabet Translator</h1>
            <p class="tool-description">Convert spelling words into military NATO standard phonetic radio words (Alfa, Bravo, Charlie) with audio pronunciation.</p>
          </div>

        <div class="form-group">
          <label class="form-label">Input Word or Code</label>
          <input type="text" id="nato-input" class="input-field" value="OMNI2026" oninput="translateNATO()">
        </div>
        <div class="form-group">
          <label class="form-label">NATO Phonetic Words</label>
          <div id="nato-badges" style="display:flex;flex-wrap:wrap;gap:0.5rem;background:var(--bg-secondary);padding:1.5rem;border-radius:var(--radius-md);border:1px solid var(--card-border);"></div>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        const NATO = {
          A:'Alfa', B:'Bravo', C:'Charlie', D:'Delta', E:'Echo', F:'Foxtrot',
          G:'Golf', H:'Hotel', I:'India', J:'Juliett', K:'Kilo', L:'Lima',
          M:'Mike', N:'November', O:'Oscar', P:'Papa', Q:'Quebec', R:'Romeo',
          S:'Sierra', T:'Tango', U:'Uniform', V:'Victor', W:'Whiskey', X:'X-ray',
          Y:'Yankee', Z:'Zulu', '0':'Zero', '1':'One', '2':'Two', '3':'Three',
          '4':'Four', '5':'Five', '6':'Six', '7':'Seven', '8':'Eight', '9':'Nine'
        };
        function translateNATO() {
          const text = document.getElementById('nato-input').value.toUpperCase();
          const badges = document.getElementById('nato-badges');
          badges.innerHTML = text.split('').map(c => {
            const word = NATO[c] || c;
            return `<div style="background:var(--accent-gradient);color:#fff;padding:6px 12px;border-radius:6px;font-weight:700;"><strong>${c}</strong>: ${word}</div>`;
          }).join('');
        }
        function speakNATO() {
          const text = document.getElementById('nato-input').value.toUpperCase();
          const words = text.split('').map(c => NATO[c] || c).join(' ');
          const utt = new SpeechSynthesisUtterance(words);
          speechSynthesis.speak(utt);
        }
        translateNATO();
        
  </script>
