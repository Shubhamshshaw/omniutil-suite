<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Resolution & Device Display Inspector | OmniUtil</title>
  <meta name="description" content="Inspect device screen dimensions, browser viewport size, pixel ratio (Retina), color depth, and refresh metrics.">
  <link rel="canonical" href="https://shubhamshshaw.github.io/omniutil-suite/tools/screen-resolution-checker.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Screen Resolution & Device Display Inspector | OmniUtil">
  <meta property="og:description" content="Inspect device screen dimensions, browser viewport size, pixel ratio (Retina), color depth, and refresh metrics.">
  <meta property="og:url" content="https://shubhamshshaw.github.io/omniutil-suite/tools/screen-resolution-checker.html">

  <!-- Google AdSense Verification & Auto ads script -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8836410103198896" crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>🖥️ Screen Resolution & Device Display Inspector</h1>
            <p class="tool-description">Inspect device screen dimensions, browser viewport size, pixel ratio (Retina), color depth, and refresh metrics.</p>
          </div>
        </div>
        
        <div id="screen-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;"></div>
        
      </div>
      <aside>
        <div class="ad-unit ad-sidebar">
          <span class="ad-label">Advertisement</span>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="3000000085" data-ad-format="auto"></ins>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
      </aside>
    </div>
  </main>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved. Built for maximum speed, security, and responsive performance.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        function updateScreenInfo() {
          const items = [
            ['Screen Resolution', `${window.screen.width} × ${window.screen.height} px`],
            ['Available Workspace', `${window.screen.availWidth} × ${window.screen.availHeight} px`],
            ['Viewport Size', `${window.innerWidth} × ${window.innerHeight} px`],
            ['Device Pixel Ratio', `${window.devicePixelRatio.toFixed(2)}x (Retina Scale)`],
            ['Color Depth', `${window.screen.colorDepth}-bit RGB`],
            ['Orientation', window.screen.orientation ? window.screen.orientation.type : 'landscape-primary']
          ];
          document.getElementById('screen-grid').innerHTML = items.map(([k, v]) => `
            <div style="background:var(--bg-secondary);padding:1.5rem;border-radius:var(--radius-md);border:1px solid var(--card-border);text-align:center;">
              <div style="color:var(--text-secondary);font-size:0.85rem;">${k}</div>
              <div style="font-size:1.4rem;font-weight:700;color:var(--accent-primary);margin-top:0.5rem;">${v}</div>
            </div>
          `).join('');
        }
        window.addEventListener('resize', updateScreenInfo);
        updateScreenInfo();
        
  </script>
</body>
</html>
