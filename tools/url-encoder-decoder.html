<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Encoder / Decoder | OmniUtil</title>
  <meta name="description" content="Encode strings into safe URL component formats or decode encoded URLs and query parameters.">
  <link rel="canonical" href="https://shubhamshshaw.github.io/omniutil-suite/tools/url-encoder-decoder.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="URL Encoder / Decoder | OmniUtil">
  <meta property="og:description" content="Encode strings into safe URL component formats or decode encoded URLs and query parameters.">
  <meta property="og:url" content="https://shubhamshshaw.github.io/omniutil-suite/tools/url-encoder-decoder.html">

  <!-- Google AdSense Verification & Auto ads script -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8836410103198896" crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>🔗 URL Encoder / Decoder</h1>
            <p class="tool-description">Encode strings into safe URL component formats or decode encoded URLs and query parameters.</p>
          </div>
        </div>
        
        <div style="display:flex;gap:0.5rem;margin-bottom:1rem;">
          <button id="mode-enc" class="btn btn-primary" onclick="setMode('encode')">Encode</button>
          <button id="mode-dec" class="btn btn-secondary" onclick="setMode('decode')">Decode</button>
        </div>
        <div class="form-group">
          <label class="form-label" id="input-label">URL or String to Encode</label>
          <textarea id="url-input" class="textarea-field" style="min-height:130px;" placeholder="Enter URL or parameter string..."></textarea>
        </div>
        <div style="display:flex;gap:0.75rem;margin:1rem 0;">
          <button class="btn btn-primary" onclick="processURL()">Process</button>
          <button class="btn btn-secondary" onclick="copyResult()">Copy Result</button>
          <button class="btn btn-secondary" onclick="clearFields()">Clear</button>
        </div>
        <div class="form-group">
          <label class="form-label">encodeURIComponent (Standard Component)</label>
          <textarea id="url-output" class="textarea-field" style="min-height:110px;font-family:'Fira Code',monospace;" readonly></textarea>
        </div>
        <div class="form-group" id="uri-section">
          <label class="form-label">encodeURI (Full URL Format)</label>
          <textarea id="url-output-full" class="textarea-field" style="min-height:70px;font-family:'Fira Code',monospace;" readonly></textarea>
        </div>
        
      </div>
      <aside>
        <div class="ad-unit ad-sidebar">
          <span class="ad-label">Advertisement</span>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="3000000012" data-ad-format="auto"></ins>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
      </aside>
    </div>
  </main>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved. Built for maximum speed, security, and responsive performance.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        let currentMode = 'encode';
        function setMode(mode) {
          currentMode = mode;
          document.getElementById('mode-enc').className = mode === 'encode' ? 'btn btn-primary' : 'btn btn-secondary';
          document.getElementById('mode-dec').className = mode === 'decode' ? 'btn btn-primary' : 'btn btn-secondary';
          document.getElementById('input-label').textContent = mode === 'encode' ? 'URL or String to Encode' : 'Encoded String to Decode';
          document.getElementById('uri-section').style.display = mode === 'encode' ? 'block' : 'none';
          processURL();
        }
        function processURL() {
          const val = document.getElementById('url-input').value;
          try {
            if (currentMode === 'encode') {
              document.getElementById('url-output').value = encodeURIComponent(val);
              document.getElementById('url-output-full').value = encodeURI(val);
            } else {
              document.getElementById('url-output').value = decodeURIComponent(val);
            }
          } catch(e) {
            document.getElementById('url-output').value = 'Invalid encoded URI string';
          }
        }
        function copyResult() {
          const res = document.getElementById('url-output').value;
          if (res) copyToClipboard(res, 'URL copied to clipboard!');
        }
        function clearFields() {
          document.getElementById('url-input').value = '';
          document.getElementById('url-output').value = '';
          document.getElementById('url-output-full').value = '';
        }
        document.getElementById('url-input').addEventListener('input', processURL);
        
  </script>
</body>
</html>
