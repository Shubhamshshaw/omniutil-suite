        <div class="form-group">
          <label class="form-label">Enter Number (up to 12 digits)</label>
          <input type="number" id="num-input" class="input-field" value="12450" placeholder="12345" oninput="convertNum()">
        </div>
        <div class="form-group">
          <label class="form-label">English Words</label>

  <script>

        const ONES = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
        const TENS = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
        function numToWords(n) {
          if (n === 0) return 'Zero';
          function helper(num) {
            let s = '';
            if (num >= 100) {
              s += ONES[Math.floor(num / 100)] + ' Hundred ';
              num %= 100;
            }
            if (num >= 20) {
              s += TENS[Math.floor(num / 10)] + ' ';
              num %= 10;
            }
            if (num > 0) {
              s += ONES[num] + ' ';
            }
            return s.trim();
          }
          let res = '';
          if (n >= 1e9) { res += helper(Math.floor(n / 1e9)) + ' Billion '; n %= 1e9; }
          if (n >= 1e6) { res += helper(Math.floor(n / 1e6)) + ' Million '; n %= 1e6; }
          if (n >= 1e3) { res += helper(Math.floor(n / 1e3)) + ' Thousand '; n %= 1e3; }
          if (n > 0) { res += helper(n); }
          return res.trim();
        }
        function convertNum() {
          const val = parseInt(document.getElementById('num-input').value) || 0;
          document.getElementById('num-words').value = numToWords(val);
        }
        convertNum();
        
  </script>
