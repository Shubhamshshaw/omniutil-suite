  <header class="app-header">

        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>🆔 UUID / GUID Generator</h1>
            <p class="tool-description">Generate RFC 4122 compliant version 4 UUIDs and GUIDs in bulk with customizable casing and formatting.</p>
          </div>
        </div>
        
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.5rem;">
          <div class="form-group">
            <label class="form-label">Quantity</label>
            <select id="uuid-count" class="select-field">
              <option value="1">1 UUID</option>
              <option value="5" selected>5 UUIDs</option>
              <option value="10">10 UUIDs</option>
              <option value="25">25 UUIDs</option>
              <option value="50">50 UUIDs</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Letter Casing</label>
            <select id="uuid-case" class="select-field">
              <option value="lower">lowercase</option>
              <option value="upper">UPPERCASE</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Formatting</label>
            <select id="uuid-format" class="select-field">
              <option value="hyphens">Standard with Hyphens</option>
              <option value="nohyphens">No Hyphens (Compact)</option>
              <option value="braces">{Braces Encased}</option>
            </select>
          </div>
        </div>
        <div style="display:flex;gap:0.75rem;margin-bottom:1.5rem;">
          <button class="btn btn-primary" onclick="generateUUIDs()">Generate New UUIDs</button>
          <button class="btn btn-secondary" onclick="copyAllUUIDs()">Copy All</button>
        </div>
        <div class="form-group">
          <label class="form-label">Generated UUIDs</label>
          <textarea id="uuid-output" class="textarea-field" style="min-height:180px;font-family:'Fira Code',monospace;" readonly></textarea>
        </div>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        function genSingleV4() {
          if (crypto.randomUUID) return crypto.randomUUID();
          return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            const r = Math.random() * 16 | 0;
            const v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
          });
        }
        function generateUUIDs() {
          const count = parseInt(document.getElementById('uuid-count').value);
          const casing = document.getElementById('uuid-case').value;
          const fmt = document.getElementById('uuid-format').value;
          const uuids = [];
          for (let i = 0; i < count; i++) {
            let u = genSingleV4();
            if (fmt === 'nohyphens') u = u.replace(/-/g, '');
            else if (fmt === 'braces') u = '{' + u + '}';
            if (casing === 'upper') u = u.toUpperCase();
            else u = u.toLowerCase();
            uuids.push(u);
          }
          document.getElementById('uuid-output').value = uuids.join('\n');
        }
        function copyAllUUIDs() {
          const val = document.getElementById('uuid-output').value;
          if (val) copyToClipboard(val, 'All UUIDs copied!');
        }
        generateUUIDs();
        
  </script>
