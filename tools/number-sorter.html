<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Sorter & Statistical Analyzer | OmniUtil</title>
  <meta name="description" content="Sort sets of numbers in ascending or descending order and calculate mean, median, mode, and standard deviation.">
  <link rel="canonical" href="https://shubhamshshaw.github.io/omniutil-suite/tools/number-sorter.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Number Sorter & Statistical Analyzer | OmniUtil">
  <meta property="og:description" content="Sort sets of numbers in ascending or descending order and calculate mean, median, mode, and standard deviation.">
  <meta property="og:url" content="https://shubhamshshaw.github.io/omniutil-suite/tools/number-sorter.html">

  <!-- Google AdSense Verification & Auto ads script -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8836410103198896" crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>📈 Number Sorter & Statistical Analyzer</h1>
            <p class="tool-description">Sort sets of numbers in ascending or descending order and calculate mean, median, mode, and standard deviation.</p>
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Input Numbers (Separated by commas or spaces)</label>
          <textarea id="num-series" class="textarea-field" style="min-height:90px;" oninput="computeStats()">42, 17, 88, 12, 65, 33, 91, 5, 23, 76</textarea>
        </div>
        <div style="display:flex;gap:0.75rem;margin:1rem 0;">
          <button class="btn btn-primary" onclick="sortNum(true)">Sort Ascending (0 → 9)</button>
          <button class="btn btn-secondary" onclick="sortNum(false)">Sort Descending (9 → 0)</button>
        </div>
        <div id="stats-cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1rem;margin-bottom:1.5rem;"></div>
        <div class="form-group">
          <label class="form-label">Sorted Number Sequence</label>
          <input type="text" id="sorted-output" class="input-field" style="font-family:'Fira Code',monospace;" readonly>
        </div>
        
      </div>
      <aside>
        <div class="ad-unit ad-sidebar">
          <span class="ad-label">Advertisement</span>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="3000000087" data-ad-format="auto"></ins>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
      </aside>
    </div>
  </main>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved. Built for maximum speed, security, and responsive performance.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        function parseNums() {
          return document.getElementById('num-series').value.split(/[,\s]+/).map(Number).filter(n => !isNaN(n));
        }
        function computeStats() {
          const nums = parseNums();
          if (nums.length === 0) return;
          const sum = nums.reduce((a, b) => a + b, 0);
          const mean = (sum / nums.length).toFixed(2);
          const sorted = [...nums].sort((a,b) => a - b);
          const mid = Math.floor(sorted.length / 2);
          const median = sorted.length % 2 === 0 ? ((sorted[mid - 1] + sorted[mid]) / 2).toFixed(2) : sorted[mid];
          const min = Math.min(...nums);
          const max = Math.max(...nums);

          const items = [
            ['Count', nums.length],
            ['Sum', sum],
            ['Mean (Avg)', mean],
            ['Median', median],
            ['Min / Max', `${min} / ${max}`]
          ];
          document.getElementById('stats-cards').innerHTML = items.map(([k, v]) => `
            <div style="background:var(--bg-secondary);padding:1rem;border-radius:var(--radius-md);border:1px solid var(--card-border);text-align:center;">
              <div style="color:var(--text-secondary);font-size:0.8rem;">${k}</div>
              <div style="font-size:1.25rem;font-weight:700;color:var(--accent-primary);margin-top:0.25rem;">${v}</div>
            </div>
          `).join('');
        }
        function sortNum(asc) {
          const nums = parseNums();
          nums.sort((a,b) => asc ? a - b : b - a);
          document.getElementById('sorted-output').value = nums.join(', ');
        }
        computeStats();
        sortNum(true);
        
  </script>
</body>
</html>
