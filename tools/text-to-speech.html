<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text to Speech Converter | OmniUtil</title>
  <meta name="description" content="Convert any text to speech with voice, speed and pitch controls using Web Speech API.">
  <link rel="canonical" href="https://shubhamshshaw.github.io/omniutil-suite/tools/text-to-speech.html">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8836410103198896" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <header class="app-header"><div class="header-container">
    <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
    <div class="nav-controls">
      <button id="search-trigger" class="search-trigger"><span>&#128269;</span><span>Search tools...</span><span class="shortcut-badge">&#8984;K</span></button>
      <button id="theme-toggle" class="btn-icon">&#9728;&#65039;</button>
    </div>
  </div></header>
  <main class="main-wrapper"><div class="tool-layout">
    <div class="tool-card">
      <div class="tool-header"><div class="tool-title-group">
        <h1>&#128266; Text to Speech Converter</h1>
        <p class="tool-description">Convert any text to speech with voice, speed and pitch controls using Web Speech API.</p>
      </div></div>
      <div class="form-group"><label class="form-label">Enter Text</label>
<textarea id="tts-text" class="textarea-field" style="min-height:150px" placeholder="Type or paste text here...">Hello! Welcome to OmniUtil Text to Speech tool. This converts your text to spoken words using your browser's built-in speech synthesis.</textarea></div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin:1rem 0">
<div class="form-group"><label class="form-label">Voice</label><select id="tts-voice" class="select-field"></select></div>
<div class="form-group"><label class="form-label">Speed: <span id="rate-val">1.0</span>x</label><input type="range" id="tts-rate" min="0.5" max="2" step="0.1" value="1" class="input-field" oninput="document.getElementById('rate-val').textContent=parseFloat(this.value).toFixed(1)"></div>
<div class="form-group"><label class="form-label">Pitch: <span id="pitch-val">1.0</span></label><input type="range" id="tts-pitch" min="0.5" max="2" step="0.1" value="1" class="input-field" oninput="document.getElementById('pitch-val').textContent=parseFloat(this.value).toFixed(1)"></div>
</div>
<div style="display:flex;gap:0.75rem;flex-wrap:wrap">
<button class="btn btn-primary" id="play-btn" onclick="ttsPlay()">&#9654; Play</button>
<button class="btn btn-secondary" onclick="ttsPause()">&#9646;&#9646; Pause</button>
<button class="btn btn-secondary" onclick="ttsStop()">&#9632; Stop</button>
</div>
<div id="tts-status" style="margin-top:1rem;color:var(--text-secondary);font-size:0.85rem"></div>
    </div>
    <aside><div class="ad-unit ad-sidebar"><span class="ad-label">Advertisement</span>
      <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="3000000003" data-ad-format="auto"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div></aside>
  </div></main>
  <div id="search-modal-overlay" class="modal-overlay"><div class="search-modal">
    <div class="search-input-wrapper"><span>&#128269;</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
    <div id="search-results" class="search-results"></div>
  </div></div>
  <footer class="app-footer"><div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved.</div></footer>
  <script src="../js/app.js"></script>
  <script>const synth = window.speechSynthesis;
let voices = [];
function loadVoices(){
  voices = synth.getVoices();
  const sel = document.getElementById('tts-voice');
  sel.innerHTML = voices.map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join('');
}
if(synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;
loadVoices();
function ttsPlay(){
  synth.cancel();
  const text = document.getElementById('tts-text').value;
  if(!text) return;
  const utt = new SpeechSynthesisUtterance(text);
  utt.voice = voices[document.getElementById('tts-voice').value] || null;
  utt.rate = parseFloat(document.getElementById('tts-rate').value);
  utt.pitch = parseFloat(document.getElementById('tts-pitch').value);
  utt.onstart = ()=>document.getElementById('tts-status').textContent='Speaking...';
  utt.onend = ()=>document.getElementById('tts-status').textContent='Done.';
  synth.speak(utt);
}
function ttsPause(){ synth.paused ? synth.resume() : synth.pause(); }
function ttsStop(){ synth.cancel(); document.getElementById('tts-status').textContent='Stopped.'; }</script>
</body></html>
