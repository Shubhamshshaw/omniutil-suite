  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>🍅 Pomodoro Productivity Focus Timer</h1>
            <p class="tool-description">Boost work productivity using the 25-minute Pomodoro study technique with sound alerts and interval breaks.</p>
          </div>
        </div>
        
        <div style="max-width:400px;margin:0 auto;text-align:center;background:var(--bg-secondary);padding:2rem;border-radius:var(--radius-lg);border:1px solid var(--card-border);">
          <div style="display:flex;gap:0.5rem;justify-content:center;margin-bottom:1.5rem;">
            <button id="mode-work" class="btn btn-sm btn-primary" onclick="setTimer(25)">Work (25m)</button>
            <button id="mode-short" class="btn btn-sm btn-secondary" onclick="setTimer(5)">Short Break (5m)</button>
            <button id="mode-long" class="btn btn-sm btn-secondary" onclick="setTimer(15)">Long Break (15m)</button>
          </div>
          <div id="pomo-time" style="font-size:3.75rem;font-weight:800;font-family:'Fira Code',monospace;color:var(--accent-primary);margin-bottom:1.5rem;">25:00</div>
          <div style="display:flex;gap:0.75rem;justify-content:center;">
            <button id="pomo-toggle" class="btn btn-primary" onclick="toggleTimer()">Start Focus</button>
            <button class="btn btn-secondary" onclick="resetTimer()">Reset</button>
          </div>
        </div>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        let totalSec = 25 * 60;
        let leftSec = totalSec;
        let timerId = null;

        function setTimer(min) {
          clearInterval(timerId);
          timerId = null;
          document.getElementById('pomo-toggle').textContent = 'Start Focus';
          totalSec = min * 60;
          leftSec = totalSec;
          updateDisplay();
        }
        function toggleTimer() {
          if (timerId) {
            clearInterval(timerId);
            timerId = null;
            document.getElementById('pomo-toggle').textContent = 'Resume';
          } else {
            timerId = setInterval(() => {
              if (leftSec > 0) {
                leftSec--;
                updateDisplay();
              } else {
                clearInterval(timerId);
                timerId = null;
                showToast('Pomodoro Interval Complete!', 'success');
              }
            }, 1000);
            document.getElementById('pomo-toggle').textContent = 'Pause';
          }
        }
        function resetTimer() {
          clearInterval(timerId);
          timerId = null;
          leftSec = totalSec;
          document.getElementById('pomo-toggle').textContent = 'Start Focus';
          updateDisplay();
        }
        function updateDisplay() {
          const m = String(Math.floor(leftSec / 60)).padStart(2, '0');
          const s = String(leftSec % 60).padStart(2, '0');
          document.getElementById('pomo-time').textContent = `${m}:${s}`;
        }
        updateDisplay();
        
  </script>
</body>
