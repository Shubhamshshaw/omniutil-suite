  <meta property="og:type" content="website">
  <meta property="og:title" content="Scientific Calculator | OmniUtil">
  <meta property="og:description" content="High-precision scientific calculator supporting trigonometry, logarithms, powers, factorials, and calculation history.">
  <meta property="og:url" content="https://shubhamshshaw.github.io/omniutil-suite/tools/scientific-calculator.html">

  <!-- Google AdSense Verification & Auto ads script -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">

<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>🔬 Scientific Calculator</h1>
            <p class="tool-description">High-precision scientific calculator supporting trigonometry, logarithms, powers, factorials, and calculation history.</p>
          </div>
        </div>
        
        <div style="max-width:480px;margin:0 auto;background:var(--bg-secondary);padding:1.5rem;border-radius:var(--radius-lg);border:1px solid var(--card-border);box-shadow:var(--shadow-lg);">
          <input type="text" id="calc-display" class="input-field" style="font-family:'Fira Code',monospace;font-size:1.8rem;text-align:right;margin-bottom:1rem;height:64px;padding:0 1rem;" value="0" readonly>
          <div style="display:grid;grid-template-columns:repeat(5, 1fr);gap:8px;">
            <button class="btn btn-secondary" onclick="calcOp('sin')">sin</button>
            <button class="btn btn-secondary" onclick="calcOp('cos')">cos</button>
            <button class="btn btn-secondary" onclick="calcOp('tan')">tan</button>
            <button class="btn btn-secondary" onclick="calcOp('pi')">π</button>
            <button class="btn btn-secondary" onclick="calcClear()" style="color:var(--danger);font-weight:700;">AC</button>

            <button class="btn btn-secondary" onclick="calcOp('ln')">ln</button>
            <button class="btn btn-secondary" onclick="calcOp('log')">log</button>
            <button class="btn btn-secondary" onclick="calcOp('sqrt')">√</button>
            <button class="btn btn-secondary" onclick="calcInput('^')">^</button>
            <button class="btn btn-secondary" onclick="calcInput('/')">÷</button>

            <button class="btn btn-secondary" onclick="calcInput('(')">(</button>
            <button class="btn btn-secondary" onclick="calcInput('7')">7</button>
            <button class="btn btn-secondary" onclick="calcInput('8')">8</button>
            <button class="btn btn-secondary" onclick="calcInput('9')">9</button>
            <button class="btn btn-secondary" onclick="calcInput('*')">×</button>

            <button class="btn btn-secondary" onclick="calcInput(')')">)</button>
            <button class="btn btn-secondary" onclick="calcInput('4')">4</button>
            <button class="btn btn-secondary" onclick="calcInput('5')">5</button>
            <button class="btn btn-secondary" onclick="calcInput('6')">6</button>
            <button class="btn btn-secondary" onclick="calcInput('-')">-</button>

            <button class="btn btn-secondary" onclick="calcOp('fact')">n!</button>
            <button class="btn btn-secondary" onclick="calcInput('1')">1</button>
            <button class="btn btn-secondary" onclick="calcInput('2')">2</button>
            <button class="btn btn-secondary" onclick="calcInput('3')">3</button>
            <button class="btn btn-secondary" onclick="calcInput('+')">+</button>

            <button class="btn btn-secondary" onclick="calcOp('e')">e</button>
            <button class="btn btn-secondary" onclick="calcInput('0')">0</button>
            <button class="btn btn-secondary" onclick="calcInput('.')">.</button>
            <button class="btn btn-primary" onclick="calcEval()" style="grid-column:span 2;font-size:1.25rem;">=</button>
          </div>
        </div>
        
      </div>
      <aside>
        <div class="ad-unit ad-sidebar">
          <span class="ad-label">Advertisement</span>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="3000000041" data-ad-format="auto"></ins>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
      </aside>
    </div>
  </main>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved. Built for maximum speed, security, and responsive performance.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        let expr = '0';
        function calcInput(ch) {
          if (expr === '0' && ch !== '.') expr = ch;
          else expr += ch;
          document.getElementById('calc-display').value = expr;
        }
        function calcClear() {
          expr = '0';
          document.getElementById('calc-display').value = expr;
        }
        function calcOp(op) {
          if (op === 'pi') calcInput(Math.PI.toFixed(4));
          else if (op === 'e') calcInput(Math.E.toFixed(4));
          else {
            try {
              let val = eval(expr.replace(/\^/g, '**'));
              if (op === 'sin') val = Math.sin(val);
              else if (op === 'cos') val = Math.cos(val);
              else if (op === 'tan') val = Math.tan(val);
              else if (op === 'log') val = Math.log10(val);
              else if (op === 'ln') val = Math.log(val);
              else if (op === 'sqrt') val = Math.sqrt(val);
              else if (op === 'fact') {
                let f = 1;
                for (let i = 2; i <= Math.floor(val); i++) f *= i;
                val = f;
              }
              expr = String(Number(val.toFixed(8)));
              document.getElementById('calc-display').value = expr;
            } catch(e) {
              document.getElementById('calc-display').value = 'Error';
              expr = '0';
            }
          }
        }
        function calcEval() {
          try {
            const clean = expr.replace(/\^/g, '**');
            const res = eval(clean);
            expr = String(res);
            document.getElementById('calc-display').value = expr;
          } catch(e) {
            document.getElementById('calc-display').value = 'Error';
            expr = '0';
          }
        }
        
  </script>
</body>
</html>
