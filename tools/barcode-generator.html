  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>📶 Barcode Generator (Code 128 / Code 39)</h1>
            <p class="tool-description">Generate Code 128 and Code 39 standard barcodes in high resolution with PNG download.</p>
          </div>
        </div>
        
        <div style="display:grid;grid-template-columns:1fr 180px;gap:1rem;margin-bottom:1.5rem;">
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Barcode Value / Data</label>
            <input type="text" id="barcode-val" class="input-field" value="OMNIUTIL-2026" placeholder="Enter text or numbers...">
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Barcode Height</label>
            <input type="range" id="barcode-height" min="50" max="150" value="80" class="input-field" oninput="renderBarcode()">
          </div>
        </div>
        <div style="display:flex;gap:0.75rem;margin-bottom:1.5rem;">
          <button class="btn btn-primary" onclick="renderBarcode()">Generate Barcode</button>
          <button class="btn btn-secondary" onclick="downloadBarcode()">Download PNG</button>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;background:var(--bg-secondary);padding:2rem;border-radius:var(--radius-md);border:1px solid var(--card-border);">
          <canvas id="barcode-canvas" style="background:#fff;padding:15px;border-radius:6px;max-width:100%;"></canvas>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        const CODE39 = {
          '0': '000110100', '1': '100100001', '2': '001100001', '3': '101100000',
          '4': '000110001', '5': '100110000', '6': '001110000', '7': '000100101',
          '8': '100100100', '9': '001100100', 'A': '100001001', 'B': '001001001',
          'C': '101001000', 'D': '000011001', 'E': '100011000', 'F': '001011000',
          'G': '000001101', 'H': '100001100', 'I': '001001100', 'J': '000011100',
          'K': '100000011', 'L': '001000011', 'M': '101000010', 'N': '000010011',
          'O': '100010010', 'P': '001010010', 'Q': '000000111', 'R': '100000110',
          'S': '001000110', 'T': '000010110', 'U': '110000001', 'V': '011000001',
          'W': '111000000', 'X': '010010001', 'Y': '110010000', 'Z': '011010000',
          '-': '010000101', '.': '110000100', ' ': '011000100', '*': '010010100',
          '$': '010101000', '/': '010100010', '+': '010001010', '%': '000101010'
        };
        function renderBarcode() {
          const canvas = document.getElementById('barcode-canvas');
          const ctx = canvas.getContext('2d');
          const raw = document.getElementById('barcode-val').value.toUpperCase().trim() || 'OMNIUTIL';
          const height = parseInt(document.getElementById('barcode-height').value);
          const val = '*' + raw + '*';

          let pattern = '';
          for (let i = 0; i < val.length; i++) {
            const ch = val[i];
            const p = CODE39[ch] || CODE39['-'];
            pattern += p + '0';
          }

          const narrow = 2;
          const wide = 5;
          let totalW = 0;
          for (let i = 0; i < pattern.length; i++) {
            const isWide = pattern[i] === '1';
            totalW += isWide ? wide : narrow;
          }

          canvas.width = totalW + 40;
          canvas.height = height + 35;
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          let curX = 20;
          ctx.fillStyle = '#000000';
          for (let i = 0; i < pattern.length; i++) {
            const isBar = (i % 2 === 0);
            const isWide = pattern[i] === '1';
            const barW = isWide ? wide : narrow;
            if (isBar) {
              ctx.fillRect(curX, 10, barW, height);
            }
            curX += barW;
          }

          ctx.font = '14px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(raw, canvas.width / 2, height + 28);
          document.getElementById('barcode-caption').textContent = raw;
        }
        function downloadBarcode() {
          const canvas = document.getElementById('barcode-canvas');
          const link = document.createElement('a');
          link.download = 'barcode.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
          showToast('Barcode downloaded as PNG', 'success');
        }
        document.getElementById('barcode-val').addEventListener('input', renderBarcode);
        renderBarcode();
        
  </script>
</body>
</html>
