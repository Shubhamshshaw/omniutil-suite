<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lorem Ipsum Generator - Placeholder Text | OmniUtil</title>
  <meta name="description" content="Generate classic lorem ipsum placeholder text with custom paragraphs, sentences, and word counts.">
  <link rel="canonical" href="https://shubhamshshaw.github.io/omniutil-suite/tools/lorem-ipsum-generator.html">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8836410103198896" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <header class="app-header"><div class="header-container">
    <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
    <div class="nav-controls">
      <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
      <button id="theme-toggle" class="btn-icon">☀️</button>
    </div>
  </div></header>
  <main class="main-wrapper"><div class="tool-layout">
    <div class="tool-card">
      <div class="tool-header"><div class="tool-title-group">
        <h1>📖 Lorem Ipsum Generator</h1>
        <p class="tool-description">Generate classic placeholder text with custom paragraph and sentence counts.</p>
      </div></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem;">
        <div class="form-group">
          <label class="form-label">Paragraphs: <strong id="para-val">3</strong></label>
          <input type="range" id="para-count" min="1" max="20" value="3" class="input-field" oninput="document.getElementById('para-val').textContent=this.value">
        </div>
        <div class="form-group">
          <label class="form-label">Sentences/Para: <strong id="sent-val">5</strong></label>
          <input type="range" id="sent-count" min="1" max="15" value="5" class="input-field" oninput="document.getElementById('sent-val').textContent=this.value">
        </div>
        <div class="form-group">
          <label class="form-label">Style</label>
          <select id="style-select" class="select-field">
            <option value="classic">Classic Lorem Ipsum</option>
            <option value="random">Random Latin Words</option>
          </select>
        </div>
      </div>
      <div style="display:flex;gap:0.75rem;flex-wrap:wrap;margin-bottom:1rem;">
        <button class="btn btn-primary" onclick="generate()">Generate Text</button>
        <button class="btn btn-secondary" onclick="copyText()">Copy to Clipboard</button>
      </div>
      <div id="stats-bar" style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:0.75rem;"></div>
      <textarea id="output" class="textarea-field" style="min-height:300px;" readonly placeholder="Your lorem ipsum text will appear here..."></textarea>
    </div>
    <aside><div class="ad-unit ad-sidebar"><span class="ad-label">Advertisement</span>
      <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="3000000002" data-ad-format="auto"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div></aside>
  </div></main>
  <div id="search-modal-overlay" class="modal-overlay"><div class="search-modal">
    <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
    <div id="search-results" class="search-results"></div>
  </div></div>
  <footer class="app-footer"><div class="footer-bottom">&copy; 2026 OmniUtil.</div></footer>
  <script src="../js/app.js"></script>
  <script>
    const LOREM_WORDS = 'lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua ut enim ad minim veniam quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur excepteur sint occaecat cupidatat non proident sunt in culpa qui officia deserunt mollit anim id est laborum'.split(' ');
    const CLASSIC_START = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.';

    function randInt(min, max) { return Math.floor(Math.random()*(max-min+1))+min; }
    function capitalize(s) { return s.charAt(0).toUpperCase()+s.slice(1); }

    function makeSentence(wordCount) {
      const words = [];
      for (let i=0;i<wordCount;i++) words.push(LOREM_WORDS[randInt(0,LOREM_WORDS.length-1)]);
      return capitalize(words.join(' '))+'.';
    }

    function generate() {
      const paraCount = parseInt(document.getElementById('para-count').value);
      const sentCount = parseInt(document.getElementById('sent-count').value);
      const style = document.getElementById('style-select').value;
      const paras = [];
      for (let p=0;p<paraCount;p++) {
        const sentences = [];
        for (let s=0;s<sentCount;s++) {
          if (p===0 && s===0 && style==='classic') sentences.push(CLASSIC_START);
          else sentences.push(makeSentence(randInt(8,18)));
        }
        paras.push(sentences.join(' '));
      }
      const result = paras.join('\n\n');
      document.getElementById('output').value = result;
      const words = result.split(/\s+/).length;
      const chars = result.length;
      document.getElementById('stats-bar').textContent = `${paraCount} paragraphs · ${words} words · ${chars} characters`;
    }
    function copyText() {
      const t = document.getElementById('output').value;
      if (!t) return;
      copyToClipboard(t, 'Lorem ipsum text copied!');
    }
    generate();
  </script>
</body></html>
