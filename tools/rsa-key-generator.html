        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>🔑 RSA Public/Private Key Pair Generator</h1>
            <p class="tool-description">Generate cryptographically secure RSA 2048-bit or 4096-bit public and private keys in standard PEM format client-side.</p>
          </div>
        </div>
        
        <div style="display:flex;gap:1rem;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;">
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Key Size</label>
            <select id="rsa-size" class="select-field">
              <option value="2048" selected>2048 bits (Fast, Secure)</option>
              <option value="4096">4096 bits (Ultra Secure)</option>
            </select>
          </div>
          <button class="btn btn-primary" onclick="generateRSAKeys()" style="align-self:flex-end;">Generate Key Pair</button>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;">
          <div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
              <label class="form-label">Public Key (SPKI PEM)</label>
              <button class="btn btn-sm btn-secondary" onclick="copyToClipboard(document.getElementById('rsa-pub').value)">Copy</button>
            </div>
            <textarea id="rsa-pub" class="textarea-field" style="min-height:220px;font-family:'Fira Code',monospace;font-size:0.75rem;" readonly></textarea>
          </div>
          <div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
              <label class="form-label">Private Key (PKCS#8 PEM)</label>
              <button class="btn btn-sm btn-secondary" onclick="copyToClipboard(document.getElementById('rsa-priv').value)">Copy</button>
            </div>
            <textarea id="rsa-priv" class="textarea-field" style="min-height:220px;font-family:'Fira Code',monospace;font-size:0.75rem;" readonly></textarea>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        function ab2str(buf) {
          return String.fromCharCode.apply(null, new Uint8Array(buf));
        }
        async function generateRSAKeys() {
          showToast('Generating RSA keys using Web Crypto API...', 'info');
          const size = parseInt(document.getElementById('rsa-size').value);
          const keyPair = await crypto.subtle.generateKey(
            {
              name: "RSA-OAEP",
              modulusLength: size,
              publicExponent: new Uint8Array([1, 0, 1]),
              hash: "SHA-256"
            },
            true,
            ["encrypt", "decrypt"]
          );

          const exportedPub = await crypto.subtle.exportKey("spki", keyPair.publicKey);
          const b64Pub = btoa(ab2str(exportedPub));
          const pemPub = `-----BEGIN PUBLIC KEY-----\n${b64Pub.match(/.{1,64}/g).join('\n')}\n-----END PUBLIC KEY-----`;
          document.getElementById('rsa-pub').value = pemPub;

          const exportedPriv = await crypto.subtle.exportKey("pkcs8", keyPair.privateKey);
          const b64Priv = btoa(ab2str(exportedPriv));
          const pemPriv = `-----BEGIN PRIVATE KEY-----\n${b64Priv.match(/.{1,64}/g).join('\n')}\n-----END PRIVATE KEY-----`;
          document.getElementById('rsa-priv').value = pemPriv;

          showToast('RSA Keypair successfully generated!', 'success');
        }
        generateRSAKeys();
        
  </script>
