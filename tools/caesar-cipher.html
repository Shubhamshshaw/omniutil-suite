</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>🔐 Caesar Cipher Encoder & Decoder</h1>
            <p class="tool-description">Encode and decode text using classic rotational Caesar substitution cipher with shift slider and brute force solver.</p>
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Input Text</label>
          <textarea id="caesar-input" class="textarea-field" style="min-height:110px;" placeholder="Enter message to encrypt or decrypt...">Secret Hackathon Project Launch 2026</textarea>
        </div>
        <div style="display:grid;grid-template-columns:1fr 140px;gap:1.5rem;align-items:center;margin-bottom:1.5rem;">
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Shift Key: <span id="v-shift">3</span></label>
            <input type="range" id="caesar-shift" min="1" max="25" value="3" class="input-field" oninput="processCaesar()">
          </div>
          <div style="display:flex;gap:0.5rem;padding-top:1.5rem;">
            <button id="btn-enc" class="btn btn-primary" onclick="setMode('enc')">Encode</button>
            <button id="btn-dec" class="btn btn-secondary" onclick="setMode('dec')">Decode</button>
          </div>
        </div>
        <div class="form-group">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
            <label class="form-label">Result</label>
            <button class="btn btn-sm btn-secondary" onclick="copyToClipboard(document.getElementById('caesar-output').value)">Copy</button>
          </div>
          <textarea id="caesar-output" class="textarea-field" style="min-height:110px;font-family:'Fira Code',monospace;" readonly></textarea>
        </div>
        
      </div>
      <aside>
        <div class="ad-unit ad-sidebar">
          <span class="ad-label">Advertisement</span>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="3000000061" data-ad-format="auto"></ins>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved. Built for maximum speed, security, and responsive performance.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        let curMode = 'enc';
        function setMode(m) {
          curMode = m;
          document.getElementById('btn-enc').className = m === 'enc' ? 'btn btn-primary' : 'btn btn-secondary';
          document.getElementById('btn-dec').className = m === 'dec' ? 'btn btn-primary' : 'btn btn-secondary';
          processCaesar();
        }
        function processCaesar() {
          const text = document.getElementById('caesar-input').value;
          let shift = parseInt(document.getElementById('caesar-shift').value) || 3;
          document.getElementById('v-shift').textContent = shift;
          if (curMode === 'dec') shift = (26 - shift) % 26;

          let res = '';
          for (let i = 0; i < text.length; i++) {
            let c = text.charCodeAt(i);
            if (c >= 65 && c <= 90) res += String.fromCharCode(((c - 65 + shift) % 26) + 65);
            else if (c >= 97 && c <= 122) res += String.fromCharCode(((c - 97 + shift) % 26) + 97);
            else res += text[i];
          }
          document.getElementById('caesar-output').value = res;
        }
        document.getElementById('caesar-input').addEventListener('input', processCaesar);
        processCaesar();
        
  </script>
</body>
</html>
