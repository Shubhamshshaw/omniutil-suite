<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Image Cropper | OmniUtil</title>
  <meta name="description" content="Crop uploaded images with preset square, widescreen, or custom selection rectangles.">
  <link rel="canonical" href="https://shubhamshshaw.github.io/omniutil-suite/tools/image-cropper.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Interactive Image Cropper | OmniUtil">
  <meta property="og:description" content="Crop uploaded images with preset square, widescreen, or custom selection rectangles.">
  <meta property="og:url" content="https://shubhamshshaw.github.io/omniutil-suite/tools/image-cropper.html">

  <!-- Google AdSense Verification & Auto ads script -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8836410103198896" crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>✂️ Interactive Image Cropper</h1>
            <p class="tool-description">Crop uploaded images with preset square, widescreen, or custom selection rectangles.</p>
          </div>
        </div>
        
        <div id="drop-zone" class="drop-zone" onclick="document.getElementById('crop-file').click()">
          <div class="drop-zone-icon">✂️</div>
          <h3>Select or Drop Image to Crop</h3>
          <input type="file" id="crop-file" accept="image/*" style="display:none;" onchange="loadCropImage(this.files[0])">
        </div>
        <div id="crop-controls" style="display:none;margin-top:1.5rem;">
          <div style="display:flex;gap:0.75rem;margin-bottom:1rem;flex-wrap:wrap;">
            <button class="btn btn-sm btn-secondary" onclick="setPreset('1:1')">1:1 Square</button>
            <button class="btn btn-sm btn-secondary" onclick="setPreset('16:9')">16:9 Widescreen</button>
            <button class="btn btn-sm btn-secondary" onclick="setPreset('4:3')">4:3 Standard</button>
            <button class="btn btn-primary" onclick="cropAndDownload()">Crop & Download PNG</button>
          </div>
          <div style="background:var(--bg-secondary);padding:1rem;border-radius:var(--radius-md);text-align:center;">
            <canvas id="crop-canvas" style="max-width:100%;max-height:450px;border-radius:8px;cursor:crosshair;"></canvas>
          </div>
        </div>
        
      </div>
      <aside>
        <div class="ad-unit ad-sidebar">
          <span class="ad-label">Advertisement</span>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="3000000052" data-ad-format="auto"></ins>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
      </aside>
    </div>
  </main>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved. Built for maximum speed, security, and responsive performance.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        let cImg = null;
        function loadCropImage(file) {
          if (!file) return;
          const r = new FileReader();
          r.onload = e => {
            const img = new Image();
            img.onload = () => {
              cImg = img;
              const canvas = document.getElementById('crop-canvas');
              canvas.width = img.width;
              canvas.height = img.height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0);
              document.getElementById('crop-controls').style.display = 'block';
            };
            img.src = e.target.result;
          };
          r.readAsDataURL(file);
        }
        function setPreset(ratio) {
          if (!cImg) return;
          const canvas = document.getElementById('crop-canvas');
          const ctx = canvas.getContext('2d');
          ctx.drawImage(cImg, 0, 0);
          ctx.strokeStyle = '#6366f1';
          ctx.lineWidth = 4;
          let w = canvas.width * 0.8;
          let h = ratio === '1:1' ? w : ratio === '16:9' ? w * 9/16 : w * 3/4;
          ctx.strokeRect((canvas.width - w)/2, (canvas.height - h)/2, w, h);
        }
        function cropAndDownload() {
          if (!cImg) return;
          const canvas = document.getElementById('crop-canvas');
          const a = document.createElement('a');
          a.download = 'cropped.png';
          a.href = canvas.toDataURL('image/png');
          a.click();
          showToast('Image cropped and saved!', 'success');
        }
        
  </script>
</body>
</html>
