<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy-First Online Notepad | OmniUtil</title>
  <meta name="description" content="Local browser scratchpad that automatically saves notes to local device storage with zero server uploads.">
  <link rel="canonical" href="https://shubhamshshaw.github.io/omniutil-suite/tools/notepad.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Privacy-First Online Notepad | OmniUtil">
  <meta property="og:description" content="Local browser scratchpad that automatically saves notes to local device storage with zero server uploads.">
  <meta property="og:url" content="https://shubhamshshaw.github.io/omniutil-suite/tools/notepad.html">

  <!-- Google AdSense Verification & Auto ads script -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8836410103198896" crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>📓 Privacy-First Online Notepad</h1>
            <p class="tool-description">Local browser scratchpad that automatically saves notes to local device storage with zero server uploads.</p>
          </div>
        </div>
        
        <div class="form-group">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
            <span style="font-size:0.85rem;color:var(--text-secondary);" id="np-saved">Saved to local browser storage</span>
            <div style="display:flex;gap:0.5rem;">
              <button class="btn btn-sm btn-secondary" onclick="downloadTxt()">Download .txt</button>
              <button class="btn btn-sm btn-secondary" onclick="clearNotes()">Clear Note</button>
            </div>
          </div>
          <textarea id="np-content" class="textarea-field" style="min-height:360px;font-size:1.05rem;line-height:1.7;" placeholder="Start typing your notes here... everything is saved automatically in your browser." oninput="saveNotes()"></textarea>
        </div>
        
      </div>
      <aside>
        <div class="ad-unit ad-sidebar">
          <span class="ad-label">Advertisement</span>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="3000000084" data-ad-format="auto"></ins>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
      </aside>
    </div>
  </main>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved. Built for maximum speed, security, and responsive performance.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        function loadNotes() {
          const val = localStorage.getItem('omni_notepad_content');
          if (val) document.getElementById('np-content').value = val;
        }
        function saveNotes() {
          const val = document.getElementById('np-content').value;
          localStorage.setItem('omni_notepad_content', val);
          document.getElementById('np-saved').textContent = 'Saved just now';
        }
        function downloadTxt() {
          const val = document.getElementById('np-content').value;
          const blob = new Blob([val], { type: 'text/plain;charset=utf-8' });
          const a = document.createElement('a');
          a.download = 'notes.txt';
          a.href = URL.createObjectURL(blob);
          a.click();
          showToast('Downloaded notes.txt', 'success');
        }
        function clearNotes() {
          if (confirm('Clear all notepad text?')) {
            document.getElementById('np-content').value = '';
            localStorage.removeItem('omni_notepad_content');
          }
        }
        loadNotes();
        
  </script>
</body>
</html>
