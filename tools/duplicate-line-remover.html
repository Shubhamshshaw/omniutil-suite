<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duplicate Line Remover | OmniUtil</title>
  <meta name="description" content="Remove duplicate lines from text with sorting, trimming, and case-sensitive options.">
  <link rel="canonical" href="https://shubhamshshaw.github.io/omniutil-suite/tools/duplicate-line-remover.html">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8836410103198896" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <header class="app-header"><div class="header-container">
    <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
    <div class="nav-controls">
      <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
      <button id="theme-toggle" class="btn-icon">☀️</button>
    </div>
  </div></header>
  <main class="main-wrapper"><div class="tool-layout">
    <div class="tool-card">
      <div class="tool-header"><div class="tool-title-group">
        <h1>🧹 Duplicate Line Remover</h1>
        <p class="tool-description">Remove duplicate lines from text with sorting, trimming, and case-sensitive options.</p>
      </div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem">
<div class="form-group"><label class="form-label">Input (one item per line)</label>
<textarea id="dup-in" class="textarea-field" style="min-height:200px" placeholder="Paste lines here..."></textarea></div>
<div class="form-group"><label class="form-label">Output</label>
<textarea id="dup-out" class="textarea-field" style="min-height:200px" readonly></textarea></div>
</div>
<div style="display:flex;gap:1.5rem;flex-wrap:wrap;margin:1rem 0;align-items:center">
<label style="display:flex;align-items:center;gap:0.4rem"><input type="checkbox" id="dup-cs"> Case-sensitive</label>
<label style="display:flex;align-items:center;gap:0.4rem"><input type="checkbox" id="dup-trim" checked> Trim whitespace</label>
<label style="display:flex;align-items:center;gap:0.4rem"><input type="checkbox" id="dup-sort"> Sort output</label>
<button class="btn btn-primary" onclick="removeDups()">Remove Duplicates</button>
<button class="btn btn-sm btn-secondary" onclick="copyToClipboard(document.getElementById('dup-out').value,'Copied!')">Copy</button>
</div>
<div id="dup-stats" style="color:var(--text-secondary);font-size:0.85rem"></div>
    </div>
    <aside><div class="ad-unit ad-sidebar"><span class="ad-label">Advertisement</span>
      <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="3000000006" data-ad-format="auto"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div></aside>
  </div></main>
  <div id="search-modal-overlay" class="modal-overlay"><div class="search-modal">
    <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
    <div id="search-results" class="search-results"></div>
  </div></div>
  <footer class="app-footer"><div class="footer-bottom">&copy; 2026 OmniUtil.</div></footer>
  <script src="../js/app.js"></script>
  <script>function removeDups(){
  const trim=document.getElementById('dup-trim').checked;
  const cs=document.getElementById('dup-cs').checked;
  const sort=document.getElementById('dup-sort').checked;
  let lines=document.getElementById('dup-in').value.split('\n');
  const orig=lines.length;
  if(trim) lines=lines.map(l=>l.trim());
  const seen=new Set();
  const unique=lines.filter(l=>{const k=cs?l:l.toLowerCase();if(seen.has(k))return false;seen.add(k);return true;});
  let result=unique;
  if(sort) result=[...unique].sort((a,b)=>(cs?a:a.toLowerCase()).localeCompare(cs?b:b.toLowerCase()));
  document.getElementById('dup-out').value=result.join('\n');
  document.getElementById('dup-stats').textContent=`Original: ${orig} lines | Unique: ${result.length} | Removed: ${orig-result.length}`;
}</script>
</body></html>
