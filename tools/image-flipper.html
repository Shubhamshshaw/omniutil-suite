<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Mirror images horizontally or vertically and rotate clockwise or counter-clockwise with instant download.">

  <meta property="og:title" content="Image Flipper & Rotator | OmniUtil">
  <meta property="og:description" content="Mirror images horizontally or vertically and rotate clockwise or counter-clockwise with instant download.">
  <meta property="og:url" content="https://shubhamshshaw.github.io/omniutil-suite/tools/image-flipper.html">

  <!-- Google AdSense Verification & Auto ads script -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">

<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>↩️ Image Flipper & Rotator</h1>
            <p class="tool-description">Mirror images horizontally or vertically and rotate clockwise or counter-clockwise with instant download.</p>
          </div>
        </div>
        
        <div id="drop-zone" class="drop-zone" onclick="document.getElementById('flip-file').click()">
          <div class="drop-zone-icon">🔄</div>
          <h3>Select or Drop Image</h3>
          <input type="file" id="flip-file" accept="image/*" style="display:none;" onchange="loadFlipImage(this.files[0])">
        </div>
        <div id="flip-controls" style="display:none;margin-top:1.5rem;">
          <div style="display:flex;gap:0.75rem;margin-bottom:1.5rem;flex-wrap:wrap;">
            <button class="btn btn-secondary" onclick="transformFlip('flipH')">↔️ Flip Horizontal</button>
            <button class="btn btn-secondary" onclick="transformFlip('flipV')">↕️ Flip Vertical</button>
            <button class="btn btn-secondary" onclick="transformFlip('rot90')">↻ Rotate 90°</button>
            <button class="btn btn-secondary" onclick="transformFlip('rot180')">↺ Rotate 180°</button>
            <button class="btn btn-primary" onclick="downloadFlip()">Download Result</button>
          </div>
          <div style="text-align:center;background:var(--bg-secondary);padding:1rem;border-radius:var(--radius-md);">
            <canvas id="flip-canvas" style="max-width:100%;max-height:400px;border-radius:8px;"></canvas>
          </div>
        </div>
        
      </div>
      <aside>
        <div class="ad-unit ad-sidebar">
          <span class="ad-label">Advertisement</span>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="3000000054" data-ad-format="auto"></ins>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
      </aside>
    </div>
  </main>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved. Built for maximum speed, security, and responsive performance.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        let flipImg = null;
        let scaleH = 1, scaleV = 1, rotation = 0;
        function loadFlipImage(file) {
          if (!file) return;
          const r = new FileReader();
          r.onload = e => {
            const img = new Image();
            img.onload = () => {
              flipImg = img;
              scaleH = 1; scaleV = 1; rotation = 0;
              document.getElementById('flip-controls').style.display = 'block';
              drawFlipped();
            };
            img.src = e.target.result;
          };
          r.readAsDataURL(file);
        }
        function transformFlip(mode) {
          if (!flipImg) return;
          if (mode === 'flipH') scaleH = -scaleH;
          if (mode === 'flipV') scaleV = -scaleV;
          if (mode === 'rot90') rotation = (rotation + 90) % 360;
          if (mode === 'rot180') rotation = (rotation + 180) % 360;
          drawFlipped();
        }
        function drawFlipped() {
          const canvas = document.getElementById('flip-canvas');
          const isSideways = rotation === 90 || rotation === 270;
          canvas.width = isSideways ? flipImg.height : flipImg.width;
          canvas.height = isSideways ? flipImg.width : flipImg.height;
          const ctx = canvas.getContext('2d');
          ctx.translate(canvas.width / 2, canvas.height / 2);
          ctx.rotate((rotation * Math.PI) / 180);
          ctx.scale(scaleH, scaleV);
          ctx.drawImage(flipImg, -flipImg.width / 2, -flipImg.height / 2);
        }
        function downloadFlip() {
          const canvas = document.getElementById('flip-canvas');
          const a = document.createElement('a');
          a.download = 'flipped-image.png';
          a.href = canvas.toDataURL('image/png');
          a.click();
          showToast('Image downloaded!', 'success');
        }
        
  </script>
</body>
</html>
