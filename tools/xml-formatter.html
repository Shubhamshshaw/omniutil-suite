<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>📜 XML Formatter & Validator</h1>
            <p class="tool-description">Format, prettify, minify, and validate XML documents client-side with indentation formatting.</p>
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Input XML Code</label>
          <textarea id="xml-input" class="textarea-field" style="min-height:160px;font-family:'Fira Code',monospace;" placeholder="<root><item id=\"1\"><name>Sample</name></item></root>"></textarea>
        </div>
        <div style="display:flex;gap:0.75rem;margin:1rem 0;flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="formatXML()">Prettify XML</button>
          <button class="btn btn-secondary" onclick="minifyXML()">Minify XML</button>
          <button class="btn btn-secondary" onclick="validateXML()">Validate XML</button>
          <button class="btn btn-secondary" onclick="copyXML()">Copy Output</button>
        </div>
        <div id="xml-status" style="margin-bottom:1rem;"></div>
        <div class="form-group">
          <label class="form-label">Formatted XML</label>
          <textarea id="xml-output" class="textarea-field" style="min-height:160px;font-family:'Fira Code',monospace;" readonly></textarea>
        </div>
        
      </div>
      <aside>
        <div class="ad-unit ad-sidebar">

  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        function formatXML() {
          const xml = document.getElementById('xml-input').value.trim();
          if (!xml) return;
          const parser = new DOMParser();
          const doc = parser.parseFromString(xml, 'text/xml');
          const error = doc.querySelector('parsererror');
          if (error) {
            document.getElementById('xml-status').innerHTML = `<span style="color:var(--danger);">XML Parsing Error: ${error.textContent}</span>`;
            return;
          }
          document.getElementById('xml-status').innerHTML = '<span style="color:var(--success);">✓ Valid XML Structure</span>';

          function formatNode(node, depth) {
            const indent = '  '.repeat(depth);
            if (node.nodeType === Node.TEXT_NODE) {
              const text = node.nodeValue.trim();
              return text ? indent + text + '\n' : '';
            }
            if (node.nodeType === Node.ELEMENT_NODE) {
              let attrs = '';
              for (let i = 0; i < node.attributes.length; i++) {
                const a = node.attributes[i];
                attrs += ` ${a.name}="${a.value}"`;
              }
              if (node.childNodes.length === 0) {
                return `${indent}<${node.nodeName}${attrs}/>\n`;
              }
              if (node.childNodes.length === 1 && node.childNodes[0].nodeType === Node.TEXT_NODE) {
                return `${indent}<${node.nodeName}${attrs}>${node.childNodes[0].nodeValue.trim()}</${node.nodeName}>\n`;
              }
              let inner = '';
              node.childNodes.forEach(child => { inner += formatNode(child, depth + 1); });
              return `${indent}<${node.nodeName}${attrs}>\n${inner}${indent}</${node.nodeName}>\n`;
            }
            return '';
          }
          let formatted = '<?xml version="1.0" encoding="UTF-8"?>\n';
          formatted += formatNode(doc.documentElement, 0);
          document.getElementById('xml-output').value = formatted.trim();
        }
        function minifyXML() {
          let xml = document.getElementById('xml-input').value;
          xml = xml.replace(/>\s+</g, '><').replace(/<!--[\s\S]*?-->/g, '').trim();
          document.getElementById('xml-output').value = xml;
        }
        function validateXML() {
          const xml = document.getElementById('xml-input').value.trim();
          const parser = new DOMParser();
          const doc = parser.parseFromString(xml, 'text/xml');
          const error = doc.querySelector('parsererror');
          if (error) {
            document.getElementById('xml-status').innerHTML = `<span style="color:var(--danger);">Invalid XML: ${error.textContent}</span>`;
          } else {
            document.getElementById('xml-status').innerHTML = '<span style="color:var(--success);">✓ XML is well-formed and valid!</span>';
          }
        }
        function copyXML() {
          const val = document.getElementById('xml-output').value;
          if (val) copyToClipboard(val, 'XML copied to clipboard!');
        }
        
  </script>
</body>
</html>
