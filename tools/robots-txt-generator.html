<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robots.txt Generator for Web Crawlers | OmniUtil</title>
  <meta name="description" content="Generate standard search crawler directive files with custom Allow, Disallow, Sitemap, and User-agent rules.">
  <link rel="canonical" href="https://shubhamshshaw.github.io/omniutil-suite/tools/robots-txt-generator.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Robots.txt Generator for Web Crawlers | OmniUtil">
  <meta property="og:description" content="Generate standard search crawler directive files with custom Allow, Disallow, Sitemap, and User-agent rules.">
  <meta property="og:url" content="https://shubhamshshaw.github.io/omniutil-suite/tools/robots-txt-generator.html">

  <!-- Google AdSense Verification & Auto ads script -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8836410103198896" crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>🤖 Robots.txt Generator for Web Crawlers</h1>
            <p class="tool-description">Generate standard search crawler directive files with custom Allow, Disallow, Sitemap, and User-agent rules.</p>
          </div>
        </div>
        
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem;">
          <div>
            <div class="form-group">
              <label class="form-label">User-Agent</label>
              <select id="rb-agent" class="select-field">
                <option value="*">All Robots (*)</option>
                <option value="Googlebot">Googlebot</option>
                <option value="Bingbot">Bingbot</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Sitemap URL</label>
              <input type="text" id="rb-sitemap" class="input-field" value="https://shubhamshshaw.github.io/omniutil-suite/sitemap.xml" oninput="genRobots()">
            </div>
            <div class="form-group">
              <label class="form-label">Disallowed Paths (One per line)</label>
              <textarea id="rb-disallow" class="textarea-field" style="min-height:80px;" oninput="genRobots()">/admin/\n/private/\n/tmp/</textarea>
            </div>
          </div>
          <div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
              <label class="form-label">robots.txt Output</label>
              <button class="btn btn-sm btn-primary" onclick="copyRobots()">Copy robots.txt</button>
            </div>
            <textarea id="rb-output" class="textarea-field" style="min-height:220px;font-family:'Fira Code',monospace;" readonly></textarea>
          </div>
        </div>
        
      </div>
      <aside>
        <div class="ad-unit ad-sidebar">
          <span class="ad-label">Advertisement</span>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="3000000077" data-ad-format="auto"></ins>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
      </aside>
    </div>
  </main>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved. Built for maximum speed, security, and responsive performance.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        function genRobots() {
          const agent = document.getElementById('rb-agent').value;
          const sitemap = document.getElementById('rb-sitemap').value;
          const dis = document.getElementById('rb-disallow').value.split('\n').map(l => l.trim()).filter(Boolean);

          let out = `User-agent: ${agent}\nAllow: /\n`;
          dis.forEach(d => { out += `Disallow: ${d}\n`; });
          if (sitemap) out += `\nSitemap: ${sitemap}\n`;

          document.getElementById('rb-output').value = out;
        }
        function copyRobots() {
          const val = document.getElementById('rb-output').value;
          if (val) copyToClipboard(val, 'robots.txt copied!');
        }
        genRobots();
        
  </script>
</body>
</html>
