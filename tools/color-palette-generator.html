  <script>

        function hexToHSL(hex) {
          let r = parseInt(hex.slice(1, 3), 16) / 255;
          let g = parseInt(hex.slice(3, 5), 16) / 255;
          let b = parseInt(hex.slice(5, 7), 16) / 255;
          let max = Math.max(r, g, b), min = Math.min(r, g, b);
          let h, s, l = (max + min) / 2;
          if (max === min) h = s = 0;
          else {
            let d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
              case r: h = (g - b) / d + (g < b ? 6 : 0); break;
              case g: h = (b - r) / d + 2; break;
              case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
          }
          return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)];
        }
        function hslToHex(h, s, l) {
          l /= 100;
          const a = s * Math.min(l, 1 - l) / 100;
          const f = n => {
            const k = (n + h / 30) % 12;
            const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
            return Math.round(255 * color).toString(16).padStart(2, '0');
          };
          return `#${f(0)}${f(8)}${f(4)}`.toUpperCase();
        }
        function generatePalettes() {
          const hex = document.getElementById('base-color').value;
          document.getElementById('base-hex').value = hex.toUpperCase();
          const [h, s, l] = hexToHSL(hex);
          const schemes = [
            { name: 'Complementary', colors: [hslToHex(h, s, l), hslToHex((h + 180) % 360, s, l), hslToHex(h, s, Math.min(l + 20, 95)), hslToHex((h + 180) % 360, s, Math.max(l - 20, 10))] },
            { name: 'Analogous', colors: [hslToHex((h + 330) % 360, s, l), hslToHex(h, s, l), hslToHex((h + 30) % 360, s, l), hslToHex((h + 60) % 360, s, l)] },
            { name: 'Triadic Harmony', colors: [hslToHex(h, s, l), hslToHex((h + 120) % 360, s, l), hslToHex((h + 240) % 360, s, l), hslToHex(h, s, Math.max(l - 25, 15))] },
            { name: 'Monochromatic', colors: [hslToHex(h, s, 25), hslToHex(h, s, 45), hslToHex(h, s, 65), hslToHex(h, s, 85)] }
          ];

          const container = document.getElementById('palettes-container');
          container.innerHTML = schemes.map(sch => `
            <div style="background:var(--bg-secondary);padding:1.25rem;border-radius:var(--radius-md);border:1px solid var(--card-border);">
              <h4 style="margin-bottom:0.75rem;">${sch.name}</h4>
              <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:0.75rem;height:90px;">
                ${sch.colors.map(c => `
                  <div onclick="copyToClipboard('${c}','${c} copied!')" style="background:${c};border-radius:var(--radius-sm);display:flex;align-items:flex-end;justify-content:center;padding:8px;cursor:pointer;transition:transform 0.2s;box-shadow:var(--shadow-sm);" onmouseover="this.style.transform='scale(1.03)'" onmouseout="this.style.transform='scale(1)'">
                    <span style="background:rgba(0,0,0,0.6);color:#fff;font-family:'Fira Code',monospace;font-size:0.75rem;padding:2px 6px;border-radius:4px;">${c}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('');
        }
        function randomizeColor() {
          const r = () => Math.floor(Math.random() * 256).toString(16).padStart(2, '0');
          const hex = `#${r()}${r()}${r()}`;
          document.getElementById('base-color').value = hex;
          generatePalettes();
        }
        generatePalettes();
        
  </script>
