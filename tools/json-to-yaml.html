<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>📄 JSON to YAML Converter</h1>
            <p class="tool-description">Convert JSON data structures to YAML format and vice versa with clean indentation.</p>
          </div>
        </div>
        
        <div style="display:flex;gap:0.5rem;margin-bottom:1rem;">
          <button id="tab-j2y" class="btn btn-primary" onclick="setMode('j2y')">JSON → YAML</button>
          <button id="tab-y2j" class="btn btn-secondary" onclick="setMode('y2j')">YAML → JSON</button>
        </div>
        <div class="form-group">
          <label class="form-label" id="src-label">Input JSON</label>
          <textarea id="src-input" class="textarea-field" style="min-height:160px;font-family:'Fira Code',monospace;" placeholder='{\n  "name": "OmniUtil",\n  "version": "2.0",\n  "features": ["tools", "privacy", "fast"]\n}'></textarea>
        </div>
        <div style="display:flex;gap:0.75rem;margin:1rem 0;">
          <button class="btn btn-primary" onclick="convertYAML()">Convert</button>
          <button class="btn btn-secondary" onclick="copyYAML()">Copy Output</button>
          <button class="btn btn-secondary" onclick="clearYAML()">Clear</button>
        </div>
        <div class="form-group">
          <label class="form-label" id="dest-label">Output YAML</label>
          <textarea id="dest-output" class="textarea-field" style="min-height:160px;font-family:'Fira Code',monospace;" readonly></textarea>
        </div>
        
      </div>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved. Built for maximum speed, security, and responsive performance.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        let currentMode = 'j2y';
        function setMode(mode) {
          currentMode = mode;
          document.getElementById('tab-j2y').className = mode === 'j2y' ? 'btn btn-primary' : 'btn btn-secondary';
          document.getElementById('tab-y2j').className = mode === 'y2j' ? 'btn btn-primary' : 'btn btn-secondary';
          document.getElementById('src-label').textContent = mode === 'j2y' ? 'Input JSON' : 'Input YAML';
          document.getElementById('dest-label').textContent = mode === 'j2y' ? 'Output YAML' : 'Output JSON';
          convertYAML();
        }
        function jsonToYaml(obj, indent = 0) {
          const spaces = '  '.repeat(indent);
          if (obj === null) return 'null';
          if (typeof obj === 'boolean' || typeof obj === 'number') return String(obj);
          if (typeof obj === 'string') return obj.includes(':') || obj.includes('#') ? `"${obj}"` : obj;
          if (Array.isArray(obj)) {
            if (obj.length === 0) return '[]';
            return obj.map(item => `${spaces}- ${jsonToYaml(item, indent + 1).trim()}`).join('\n');
          }
          if (typeof obj === 'object') {
            const keys = Object.keys(obj);
            if (keys.length === 0) return '{}';
            return keys.map(k => {
              const val = obj[k];
              if (typeof val === 'object' && val !== null && (Array.isArray(val) ? val.length > 0 : Object.keys(val).length > 0)) {
                return `${spaces}${k}:\n${jsonToYaml(val, indent + 1)}`;
              } else {
                return `${spaces}${k}: ${jsonToYaml(val, indent + 1)}`;
              }
            }).join('\n');
          }
          return String(obj);
        }
        function convertYAML() {
          const val = document.getElementById('src-input').value.trim();
          if (!val) return;
          try {
            if (currentMode === 'j2y') {
              const obj = JSON.parse(val);
              document.getElementById('dest-output').value = jsonToYaml(obj);
            } else {
              // Simple basic YAML parser for key-value
              const lines = val.split('\n');
              const obj = {};
              lines.forEach(line => {
                const parts = line.split(':');
                if (parts.length >= 2) {
                  const k = parts[0].trim();
                  let v = parts.slice(1).join(':').trim();
                  if (v.startsWith('"') && v.endsWith('"')) v = v.slice(1, -1);
                  obj[k] = v;
                }
              });
              document.getElementById('dest-output').value = JSON.stringify(obj, null, 2);
            }
          } catch(err) {
            showToast('Conversion Error: ' + err.message, 'error');
          }
        }
        function copyYAML() {
          const val = document.getElementById('dest-output').value;
          if (val) copyToClipboard(val, 'Output copied to clipboard!');
        }
        function clearYAML() {
          document.getElementById('src-input').value = '';
          document.getElementById('dest-output').value = '';
        }
        
  </script>
</body>
