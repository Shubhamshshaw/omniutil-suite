<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>📊 JSON to CSV Converter</h1>
            <p class="tool-description">Convert JSON arrays and objects to formatted CSV files with automatic header extraction and instant download.</p>
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Input JSON Array</label>
          <textarea id="json-input" class="textarea-field" style="min-height:160px;font-family:'Fira Code',monospace;" placeholder='[\n  {"id": 1, "name": "John Doe", "email": "john@example.com"},\n  {"id": 2, "name": "Jane Smith", "email": "jane@example.com"}\n]'></textarea>
        </div>
        <div style="display:flex;gap:0.75rem;margin:1rem 0;flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="convertJSONtoCSV()">Convert to CSV</button>
          <button class="btn btn-secondary" onclick="downloadCSV()">Download .csv</button>
          <button class="btn btn-secondary" onclick="loadSampleJSON()">Load Sample</button>
          <button class="btn btn-secondary" onclick="copyCSV()">Copy CSV</button>
        </div>
        <div class="form-group">
          <label class="form-label">Generated CSV</label>
          <textarea id="csv-output" class="textarea-field" style="min-height:160px;font-family:'Fira Code',monospace;" readonly></textarea>
        </div>
        
      </div>
      <aside>
        <div class="ad-unit ad-sidebar">

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        function convertJSONtoCSV() {
          const raw = document.getElementById('json-input').value.trim();
          if (!raw) return;
          try {
            const data = JSON.parse(raw);
            const arr = Array.isArray(data) ? data : [data];
            if (arr.length === 0) return;
            const headers = Array.from(new Set(arr.flatMap(Object.keys)));
            const rows = arr.map(obj => headers.map(h => {
              let val = obj[h] === undefined || obj[h] === null ? '' : obj[h];
              if (typeof val === 'object') val = JSON.stringify(val);
              val = String(val).replace(/"/g, '""');
              return `"${val}"`;
            }).join(','));
            const csv = headers.map(h => `"${h}"`).join(',') + '\n' + rows.join('\n');
            document.getElementById('csv-output').value = csv;
          } catch(err) {
            showToast('Invalid JSON: ' + err.message, 'error');
          }
        }
        function downloadCSV() {
          const csv = document.getElementById('csv-output').value;
          if (!csv) return;
          const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'converted.csv';
          a.click();
          URL.revokeObjectURL(url);
          showToast('Downloaded converted.csv', 'success');
        }
        function copyCSV() {
          const val = document.getElementById('csv-output').value;
          if (val) copyToClipboard(val, 'CSV copied to clipboard!');
        }
        function loadSampleJSON() {
          const sample = [
            { "id": 1, "name": "Alice Johnson", "role": "Engineer", "active": true },
            { "id": 2, "name": "Bob Miller", "role": "Designer", "active": true },
            { "id": 3, "name": "Charlie Davis", "role": "Product Manager", "active": false }
          ];
          document.getElementById('json-input').value = JSON.stringify(sample, null, 2);
          convertJSONtoCSV();
        }
        
  </script>
</body>
</html>
