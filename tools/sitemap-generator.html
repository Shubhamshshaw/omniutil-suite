<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XML Sitemap Generator | OmniUtil</title>
  <meta name="description" content="Generate standard search-engine compliant XML sitemaps from URL lists with priority and frequency tags.">
  <link rel="canonical" href="https://shubhamshshaw.github.io/omniutil-suite/tools/sitemap-generator.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="XML Sitemap Generator | OmniUtil">
  <meta property="og:description" content="Generate standard search-engine compliant XML sitemaps from URL lists with priority and frequency tags.">
  <meta property="og:url" content="https://shubhamshshaw.github.io/omniutil-suite/tools/sitemap-generator.html">

  <!-- Google AdSense Verification & Auto ads script -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8836410103198896" crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>🗺️ XML Sitemap Generator</h1>
            <p class="tool-description">Generate standard search-engine compliant XML sitemaps from URL lists with priority and frequency tags.</p>
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Paste URLs (One per line)</label>
          <textarea id="sm-urls" class="textarea-field" style="min-height:120px;" placeholder="https://example.com/\nhttps://example.com/about.html\nhttps://example.com/contact.html">https://shubhamshshaw.github.io/omniutil-suite/\nhttps://shubhamshshaw.github.io/omniutil-suite/tools/file-size-compressor.html\nhttps://shubhamshshaw.github.io/omniutil-suite/tools/word-counter.html</textarea>
        </div>
        <div style="display:flex;gap:0.75rem;margin:1rem 0;">
          <button class="btn btn-primary" onclick="buildSitemap()">Generate XML Sitemap</button>
          <button class="btn btn-secondary" onclick="copyToClipboard(document.getElementById('sm-output').value)">Copy XML</button>
        </div>
        <div class="form-group">
          <label class="form-label">Generated sitemap.xml</label>
          <textarea id="sm-output" class="textarea-field" style="min-height:160px;font-family:'Fira Code',monospace;" readonly></textarea>
        </div>
        
      </div>
      <aside>
        <div class="ad-unit ad-sidebar">
          <span class="ad-label">Advertisement</span>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="3000000078" data-ad-format="auto"></ins>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
      </aside>
    </div>
  </main>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved. Built for maximum speed, security, and responsive performance.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        function buildSitemap() {
          const urls = document.getElementById('sm-urls').value.split('\n').map(u => u.trim()).filter(Boolean);
          const date = new Date().toISOString().split('T')[0];

          let xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
          xml += '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n';

          urls.forEach(u => {
            xml += `  <url>\n    <loc>${u}</loc>\n    <lastmod>${date}</lastmod>\n    <changefreq>daily</changefreq>\n    <priority>0.8</priority>\n  </url>\n`;
          });
          xml += '</urlset>';
          document.getElementById('sm-output').value = xml;
        }
        buildSitemap();
        
  </script>
</body>
</html>
