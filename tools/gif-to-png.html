<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:type" content="website">
  <meta property="og:title" content="GIF Frame Extractor & Converter | OmniUtil">
  <meta property="og:description" content="Convert animated GIF files and capture still frames as crisp PNG images client-side.">
  <meta property="og:url" content="https://shubhamshshaw.github.io/omniutil-suite/tools/gif-to-png.html">

  <!-- Google AdSense Verification & Auto ads script -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8836410103198896" crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>🎞️ GIF Frame Extractor & Converter</h1>
            <p class="tool-description">Convert animated GIF files and capture still frames as crisp PNG images client-side.</p>
          </div>
        </div>
        
        <div id="drop-zone" class="drop-zone" onclick="document.getElementById('gif-file').click()">
          <div class="drop-zone-icon">🎞️</div>
          <h3>Select or Drop GIF File</h3>
          <input type="file" id="gif-file" accept="image/gif" style="display:none;" onchange="loadGIF(this.files[0])">
        </div>
        <div id="gif-controls" style="display:none;margin-top:1.5rem;text-align:center;">
          <div style="margin-bottom:1rem;">
            <button class="btn btn-primary" onclick="captureFrame()">Capture & Download Frame (PNG)</button>
          </div>
          <div style="background:var(--bg-secondary);padding:1.5rem;border-radius:var(--radius-md);">
            <img id="gif-img" style="max-width:100%;max-height:350px;border-radius:8px;">
          </div>
          <canvas id="gif-canvas" style="display:none;"></canvas>
        </div>
        
      </div>
      <aside>
        <div class="ad-unit ad-sidebar">
          <span class="ad-label">Advertisement</span>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="3000000058" data-ad-format="auto"></ins>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
      </aside>
    </div>
  </main>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved. Built for maximum speed, security, and responsive performance.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        function loadGIF(file) {
          if (!file) return;
          const r = new FileReader();
          r.onload = e => {
            const img = document.getElementById('gif-img');
            img.src = e.target.result;
            document.getElementById('gif-controls').style.display = 'block';
          };
          r.readAsDataURL(file);
        }
        function captureFrame() {
          const img = document.getElementById('gif-img');
          const canvas = document.getElementById('gif-canvas');
          canvas.width = img.naturalWidth || 300;
          canvas.height = img.naturalHeight || 300;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const a = document.createElement('a');
          a.download = 'captured-frame.png';
          a.href = canvas.toDataURL('image/png');
          a.click();
          showToast('Captured frame downloaded!', 'success');
        }
        
  </script>
</body>
</html>
