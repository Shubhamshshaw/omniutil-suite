<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO Meta Tag Generator | OmniUtil</title>
  <meta name="description" content="Generate standard search engine meta tags, OpenGraph social cards, and mobile viewport headers.">
  <link rel="canonical" href="https://shubhamshshaw.github.io/omniutil-suite/tools/meta-tag-generator.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="SEO Meta Tag Generator | OmniUtil">
  <meta property="og:description" content="Generate standard search engine meta tags, OpenGraph social cards, and mobile viewport headers.">
  <meta property="og:url" content="https://shubhamshshaw.github.io/omniutil-suite/tools/meta-tag-generator.html">

  <!-- Google AdSense Verification & Auto ads script -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8836410103198896" crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>🏷️ SEO Meta Tag Generator</h1>
            <p class="tool-description">Generate standard search engine meta tags, OpenGraph social cards, and mobile viewport headers.</p>
          </div>
        </div>
        
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem;">
          <div>
            <div class="form-group">
              <label class="form-label">Site Title</label>
              <input type="text" id="meta-title" class="input-field" value="OmniUtil - 100-in-1 Online Browser Tools" oninput="genMeta()">
            </div>
            <div class="form-group">
              <label class="form-label">Description (Max 160 chars)</label>
              <textarea id="meta-desc" class="textarea-field" style="min-height:80px;" oninput="genMeta()">Fast, private, client-side web utility tools for developers, designers, and creators.</textarea>
            </div>
            <div class="form-group">
              <label class="form-label">Keywords (Comma separated)</label>
              <input type="text" id="meta-kw" class="input-field" value="tools, utilities, developer tools, calculator" oninput="genMeta()">
            </div>
            <div class="form-group">
              <label class="form-label">Canonical URL</label>
              <input type="text" id="meta-url" class="input-field" value="https://shubhamshshaw.github.io/omniutil-suite/" oninput="genMeta()">
            </div>
          </div>
          <div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
              <label class="form-label">Generated HTML &lt;head&gt; Tags</label>
              <button class="btn btn-sm btn-primary" onclick="copyMeta()">Copy Tags</button>
            </div>
            <textarea id="meta-code" class="textarea-field" style="min-height:280px;font-family:'Fira Code',monospace;font-size:0.8rem;" readonly></textarea>
          </div>
        </div>
        
      </div>
      <aside>
        <div class="ad-unit ad-sidebar">
          <span class="ad-label">Advertisement</span>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="3000000075" data-ad-format="auto"></ins>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
      </aside>
    </div>
  </main>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved. Built for maximum speed, security, and responsive performance.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        function genMeta() {
          const title = document.getElementById('meta-title').value;
          const desc = document.getElementById('meta-desc').value;
          const kw = document.getElementById('meta-kw').value;
          const url = document.getElementById('meta-url').value;

          const tags = `<!-- Primary Meta Tags -->\n<title>${title}</title>\n<meta name="title" content="${title}">\n<meta name="description" content="${desc}">\n<meta name="keywords" content="${kw}">\n<link rel="canonical" href="${url}">\n\n<!-- Open Graph / Facebook -->\n<meta property="og:type" content="website">\n<meta property="og:url" content="${url}">\n<meta property="og:title" content="${title}">\n<meta property="og:description" content="${desc}">\n\n<!-- Twitter -->\n<meta property="twitter:card" content="summary_large_image">\n<meta property="twitter:url" content="${url}">\n<meta property="twitter:title" content="${title}">\n<meta property="twitter:description" content="${desc}">`;

          document.getElementById('meta-code').value = tags;
        }
        function copyMeta() {
          const val = document.getElementById('meta-code').value;
          if (val) copyToClipboard(val, 'Meta tags copied!');
        }
        genMeta();
        
  </script>
</body>
</html>
