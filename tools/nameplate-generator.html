<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Card & Nameplate Designer | OmniUtil</title>
  <meta name="description" content="Design clean digital business cards, name badges, and desk plates with live preview and PNG download.">
  <link rel="canonical" href="https://shubhamshshaw.github.io/omniutil-suite/tools/nameplate-generator.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Business Card & Nameplate Designer | OmniUtil">
  <meta property="og:description" content="Design clean digital business cards, name badges, and desk plates with live preview and PNG download.">
  <meta property="og:url" content="https://shubhamshshaw.github.io/omniutil-suite/tools/nameplate-generator.html">

  <!-- Google AdSense Verification & Auto ads script -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8836410103198896" crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>💼 Business Card & Nameplate Designer</h1>
            <p class="tool-description">Design clean digital business cards, name badges, and desk plates with live preview and PNG download.</p>
          </div>
        </div>
        
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem;">
          <div>
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" id="np-name" class="input-field" value="Alex Morgan" oninput="renderCard()">
            </div>
            <div class="form-group">
              <label class="form-label">Job Title</label>
              <input type="text" id="np-title" class="input-field" value="Senior Software Architect" oninput="renderCard()">
            </div>
            <div class="form-group">
              <label class="form-label">Company / Organization</label>
              <input type="text" id="np-company" class="input-field" value="Omni Technologies Inc." oninput="renderCard()">
            </div>
            <div class="form-group">
              <label class="form-label">Email & Phone</label>
              <input type="text" id="np-contact" class="input-field" value="alex@omniutil.app | +1 (555) 019-2834" oninput="renderCard()">
            </div>
            <button class="btn btn-primary" onclick="downloadCard()">Download Card Image (PNG)</button>
          </div>
          <div style="display:flex;align-items:center;justify-content:center;background:var(--bg-secondary);padding:1.5rem;border-radius:var(--radius-md);border:1px solid var(--card-border);">
            <canvas id="card-canvas" width="400" height="240" style="border-radius:12px;box-shadow:var(--shadow-lg);max-width:100%;"></canvas>
          </div>
        </div>
        
      </div>
      <aside>
        <div class="ad-unit ad-sidebar">
          <span class="ad-label">Advertisement</span>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="3000000039" data-ad-format="auto"></ins>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
      </aside>
    </div>
  </main>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved. Built for maximum speed, security, and responsive performance.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        function renderCard() {
          const canvas = document.getElementById('card-canvas');
          const ctx = canvas.getContext('2d');
          const name = document.getElementById('np-name').value;
          const title = document.getElementById('np-title').value;
          const comp = document.getElementById('np-company').value;
          const contact = document.getElementById('np-contact').value;

          // Background Gradient
          const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
          grad.addColorStop(0, '#1a2035');
          grad.addColorStop(1, '#0a0d14');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // Accent border
          ctx.strokeStyle = '#6366f1';
          ctx.lineWidth = 3;
          ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

          // Content
          ctx.fillStyle = '#6366f1';
          ctx.font = 'bold 12px Inter, sans-serif';
          ctx.fillText(comp.toUpperCase(), 30, 48);

          ctx.fillStyle = '#f1f5f9';
          ctx.font = 'bold 22px Inter, sans-serif';
          ctx.fillText(name, 30, 95);

          ctx.fillStyle = '#94a3b8';
          ctx.font = '14px Inter, sans-serif';
          ctx.fillText(title, 30, 125);

          // Divider
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
          ctx.beginPath();
          ctx.moveTo(30, 155);
          ctx.lineTo(canvas.width - 30, 155);
          ctx.stroke();

          ctx.fillStyle = '#64748b';
          ctx.font = '11px monospace';
          ctx.fillText(contact, 30, 190);
        }
        function downloadCard() {
          const canvas = document.getElementById('card-canvas');
          const a = document.createElement('a');
          a.download = 'business-card.png';
          a.href = canvas.toDataURL('image/png');
          a.click();
          showToast('Business Card downloaded!', 'success');
        }
        renderCard();
        
  </script>
</body>
</html>
