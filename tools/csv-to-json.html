      <div class="nav-controls">

      </div>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>📑 CSV to JSON Converter</h1>
            <p class="tool-description">Convert CSV and delimiter-separated values into clean, formatted JSON arrays with header detection.</p>
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Input CSV Data</label>
          <textarea id="csv-input" class="textarea-field" style="min-height:150px;font-family:'Fira Code',monospace;" placeholder='"id","name","email"\n"1","John Doe","john@example.com"\n"2","Jane Smith","jane@example.com"'></textarea>
        </div>
        <div style="display:flex;gap:0.75rem;margin:1rem 0;flex-wrap:wrap;align-items:center;">
          <button class="btn btn-primary" onclick="convertCSVtoJSON()">Convert to JSON</button>
          <button class="btn btn-secondary" onclick="copyJSON()">Copy JSON</button>
          <button class="btn btn-secondary" onclick="downloadJSON()">Download .json</button>
          <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;">
            <input type="checkbox" id="csv-has-header" checked> First row is Header
          </label>
        </div>
        <div class="form-group">
          <label class="form-label">Generated JSON</label>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        function parseCSVLine(line) {
          const res = [];
          let cur = '';
          let inQuotes = false;
          for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (ch === '"') {
              if (inQuotes && line[i+1] === '"') { cur += '"'; i++; }
              else { inQuotes = !inQuotes; }
            } else if (ch === ',' && !inQuotes) {
              res.push(cur);
              cur = '';
            } else {
              cur += ch;
            }
          }
          res.push(cur);
          return res;
        }
        function convertCSVtoJSON() {
          const raw = document.getElementById('csv-input').value.trim();
          if (!raw) return;
          const lines = raw.split(/\r?\n/).filter(l => l.trim().length > 0);
          if (lines.length === 0) return;
          const hasHeader = document.getElementById('csv-has-header').checked;
          const parsed = lines.map(parseCSVLine);
          let result;
          if (hasHeader) {
            const headers = parsed[0];
            result = parsed.slice(1).map(row => {
              const obj = {};
              headers.forEach((h, idx) => {
                let v = row[idx] !== undefined ? row[idx] : '';
                if (!isNaN(v) && v.trim() !== '') v = Number(v);
                else if (v.toLowerCase() === 'true') v = true;
                else if (v.toLowerCase() === 'false') v = false;
                obj[h] = v;
              });
              return obj;
            });
          } else {
            result = parsed;
          }
          document.getElementById('json-output').value = JSON.stringify(result, null, 2);
        }
        function copyJSON() {
          const val = document.getElementById('json-output').value;
          if (val) copyToClipboard(val, 'JSON copied to clipboard!');
        }
        function downloadJSON() {
          const val = document.getElementById('json-output').value;
          if (!val) return;
          const blob = new Blob([val], { type: 'application/json;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'data.json';
          a.click();
          URL.revokeObjectURL(url);
          showToast('Downloaded data.json', 'success');
        }
        
  </script>
</body>
