<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discount & Sale Savings Calculator | OmniUtil</title>
  <meta name="description" content="Find final discounted prices, total savings, and percent off for sales shopping.">
  <link rel="canonical" href="https://shubhamshshaw.github.io/omniutil-suite/tools/discount-calculator.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Discount & Sale Savings Calculator | OmniUtil">
  <meta property="og:description" content="Find final discounted prices, total savings, and percent off for sales shopping.">
  <meta property="og:url" content="https://shubhamshshaw.github.io/omniutil-suite/tools/discount-calculator.html">

  <!-- Google AdSense Verification & Auto ads script -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8836410103198896" crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>🏷️ Discount & Sale Savings Calculator</h1>
            <p class="tool-description">Find final discounted prices, total savings, and percent off for sales shopping.</p>
          </div>
        </div>
        
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem;">
          <div>
            <div class="form-group">
              <label class="form-label">Original Price ($)</label>
              <input type="number" id="disc-price" class="input-field" value="120" min="0" oninput="calcDiscount()">
            </div>
            <div class="form-group">
              <label class="form-label">Discount Percentage (%)</label>
              <input type="number" id="disc-pct" class="input-field" value="25" min="0" max="100" oninput="calcDiscount()">
            </div>
          </div>
          <div style="background:var(--bg-secondary);padding:1.5rem;border-radius:var(--radius-md);border:1px solid var(--card-border);display:flex;flex-direction:column;justify-content:center;">
            <div style="font-size:0.9rem;color:var(--text-secondary);">Final Price You Pay</div>
            <div id="disc-final" style="font-size:2.25rem;font-weight:800;color:var(--success);margin:0.5rem 0;">$0</div>
            <div style="font-size:0.95rem;color:var(--text-secondary);">Total Money Saved: <strong id="disc-saved" style="color:var(--accent-primary);">$0</strong></div>
          </div>
        </div>
        
      </div>
      <aside>
        <div class="ad-unit ad-sidebar">
          <span class="ad-label">Advertisement</span>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="3000000045" data-ad-format="auto"></ins>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
      </aside>
    </div>
  </main>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved. Built for maximum speed, security, and responsive performance.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        function calcDiscount() {
          const p = parseFloat(document.getElementById('disc-price').value) || 0;
          const d = parseFloat(document.getElementById('disc-pct').value) || 0;
          const saved = p * (d / 100);
          const finalPrice = p - saved;
          document.getElementById('disc-final').textContent = '$' + finalPrice.toFixed(2);
          document.getElementById('disc-saved').textContent = '$' + saved.toFixed(2);
        }
        calcDiscount();
        
  </script>
</body>
</html>
