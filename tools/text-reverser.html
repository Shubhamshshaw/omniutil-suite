<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Reverser & Palindrome Checker | OmniUtil</title>
  <meta name="description" content="Reverse text, words or lines and check if text is a palindrome instantly.">
  <link rel="canonical" href="https://shubhamshshaw.github.io/omniutil-suite/tools/text-reverser.html">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8836410103198896" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <header class="app-header"><div class="header-container">
    <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
    <div class="nav-controls">
      <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
      <button id="theme-toggle" class="btn-icon">☀️</button>
    </div>
  </div></header>
  <main class="main-wrapper"><div class="tool-layout">
    <div class="tool-card">
      <div class="tool-header"><div class="tool-title-group">
        <h1>🔄 Text Reverser & Palindrome Checker</h1>
        <p class="tool-description">Reverse text, words or lines and check if text is a palindrome instantly.</p>
      </div></div>
      <div class="form-group"><label class="form-label">Input Text</label>
<textarea id="rev-input" class="textarea-field" style="min-height:150px" placeholder="Enter text to reverse..."></textarea></div>
<div style="display:flex;gap:0.75rem;flex-wrap:wrap;margin:1rem 0">
<button class="btn btn-primary" onclick="doReverse('text')">Reverse Text</button>
<button class="btn btn-secondary" onclick="doReverse('words')">Reverse Words</button>
<button class="btn btn-secondary" onclick="doReverse('lines')">Reverse Lines</button>
<button class="btn btn-secondary" onclick="checkPalindrome()">Check Palindrome</button>
</div>
<div class="form-group"><label class="form-label">Output</label>
<textarea id="rev-output" class="textarea-field" style="min-height:120px" readonly></textarea></div>
<div style="display:flex;gap:0.75rem;margin-top:0.75rem">
<button class="btn btn-sm btn-secondary" onclick="copyToClipboard(document.getElementById('rev-output').value,'Copied!')">Copy Result</button>
<button class="btn btn-sm btn-secondary" onclick="document.getElementById('rev-input').value='';document.getElementById('rev-output').value=''">Clear</button>
</div>
    </div>
    <aside><div class="ad-unit ad-sidebar"><span class="ad-label">Advertisement</span>
      <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="3000000005" data-ad-format="auto"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div></aside>
  </div></main>
  <div id="search-modal-overlay" class="modal-overlay"><div class="search-modal">
    <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
    <div id="search-results" class="search-results"></div>
  </div></div>
  <footer class="app-footer"><div class="footer-bottom">&copy; 2026 OmniUtil.</div></footer>
  <script src="../js/app.js"></script>
  <script>function doReverse(mode){
  const t=document.getElementById('rev-input').value;
  let r='';
  if(mode==='text') r=[...t].reverse().join('');
  else if(mode==='words') r=t.split('\n').map(l=>l.split(' ').reverse().join(' ')).join('\n');
  else if(mode==='lines') r=t.split('\n').reverse().join('\n');
  document.getElementById('rev-output').value=r;
}
function checkPalindrome(){
  const t=document.getElementById('rev-input').value;
  const clean=t.replace(/[^a-zA-Z0-9]/g,'').toLowerCase();
  const rev=[...clean].reverse().join('');
  const isPalin=clean===rev;
  document.getElementById('rev-output').value=isPalin?`"${t}" IS a palindrome!`:`"${t}" is NOT a palindrome.\nCleaned: ${clean}\nReversed: ${rev}`;
}</script>
</body></html>
