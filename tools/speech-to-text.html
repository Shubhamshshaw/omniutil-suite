<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>🎤 Speech to Text Real-Time Voice Dictation</h1>
            <p class="tool-description">Dictate thoughts into text in real-time using browser speech recognition API with live transcript and copy.</p>
          </div>
        </div>
        
        <div style="display:flex;gap:0.75rem;margin-bottom:1.5rem;align-items:center;flex-wrap:wrap;">
          <button id="stt-btn" class="btn btn-primary" onclick="toggleDictation()">🎙️ Start Dictation</button>
          <button class="btn btn-secondary" onclick="copyToClipboard(document.getElementById('stt-output').value)">Copy Transcript</button>
          <button class="btn btn-secondary" onclick="document.getElementById('stt-output').value=''">Clear</button>
          <span id="stt-status" style="color:var(--text-secondary);font-size:0.85rem;">Ready to record</span>
        </div>
        <div class="form-group">
          <label class="form-label">Live Transcribed Text</label>
          <textarea id="stt-output" class="textarea-field" style="min-height:220px;font-size:1.05rem;" placeholder="Click Start Dictation and speak into your microphone..."></textarea>
        </div>
        
      </div>
      <aside>
        <div class="ad-unit ad-sidebar">
          <span class="ad-label">Advertisement</span>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="3000000089" data-ad-format="auto"></ins>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
      </aside>
    </div>
  </main>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved. Built for maximum speed, security, and responsive performance.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        let recognition = null;
        let isRecording = false;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
          const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
          recognition = new SpeechRec();
          recognition.continuous = true;
          recognition.interimResults = true;

          recognition.onresult = event => {
            let transcript = '';
            for (let i = 0; i < event.results.length; i++) {
              transcript += event.results[i][0].transcript + ' ';
            }
            document.getElementById('stt-output').value = transcript.trim();
          };
          recognition.onerror = e => {
            document.getElementById('stt-status').textContent = 'Error: ' + e.error;
          };
          recognition.onend = () => {
            isRecording = false;
            document.getElementById('stt-btn').textContent = '🎙️ Start Dictation';
            document.getElementById('stt-status').textContent = 'Dictation paused';
          };
        }
        function toggleDictation() {
          if (!recognition) {
            alert('Speech recognition is not supported in this browser. Please use Google Chrome or Microsoft Edge.');
            return;
          }
          if (isRecording) {
            recognition.stop();
          } else {
            recognition.start();
            isRecording = true;
            document.getElementById('stt-btn').textContent = '⏹️ Stop Dictation';
            document.getElementById('stt-status').textContent = 'Listening to your microphone...';
          }
        }
        
  </script>
</body>
</html>
