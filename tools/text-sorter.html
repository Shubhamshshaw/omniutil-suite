<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Line Sorter | OmniUtil</title>
  <meta name="description" content="Sort lines of text alphabetically (A-Z or Z-A), by length, numerically, or randomize with whitespace filters.">
  <link rel="canonical" href="https://shubhamshshaw.github.io/omniutil-suite/tools/text-sorter.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Text Line Sorter | OmniUtil">
  <meta property="og:description" content="Sort lines of text alphabetically (A-Z or Z-A), by length, numerically, or randomize with whitespace filters.">
  <meta property="og:url" content="https://shubhamshshaw.github.io/omniutil-suite/tools/text-sorter.html">

  <!-- Google AdSense Verification & Auto ads script -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8836410103198896" crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>🔤 Text Line Sorter</h1>
            <p class="tool-description">Sort lines of text alphabetically (A-Z or Z-A), by length, numerically, or randomize with whitespace filters.</p>
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Input Text (Line by Line)</label>
          <textarea id="sort-input" class="textarea-field" style="min-height:160px;" placeholder="Apple\nOrange\nBanana\nGrape\nPineapple"></textarea>
        </div>
        <div style="display:flex;gap:0.75rem;margin:1rem 0;flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="sortLines('az')">Sort A → Z</button>
          <button class="btn btn-primary" onclick="sortLines('za')">Sort Z → A</button>
          <button class="btn btn-secondary" onclick="sortLines('len-asc')">By Length (Asc)</button>
          <button class="btn btn-secondary" onclick="sortLines('len-desc')">By Length (Desc)</button>
          <button class="btn btn-secondary" onclick="sortLines('shuffle')">Random Shuffle</button>
          <button class="btn btn-secondary" onclick="copySorted()">Copy Output</button>
        </div>
        <div class="form-group">
          <label class="form-label">Sorted Output</label>
          <textarea id="sort-output" class="textarea-field" style="min-height:160px;" readonly></textarea>
        </div>
        
      </div>
      <aside>
        <div class="ad-unit ad-sidebar">
          <span class="ad-label">Advertisement</span>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="3000000026" data-ad-format="auto"></ins>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
      </aside>
    </div>
  </main>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved. Built for maximum speed, security, and responsive performance.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        function sortLines(mode) {
          const raw = document.getElementById('sort-input').value;
          let lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
          if (mode === 'az') lines.sort((a,b) => a.localeCompare(b));
          else if (mode === 'za') lines.sort((a,b) => b.localeCompare(a));
          else if (mode === 'len-asc') lines.sort((a,b) => a.length - b.length || a.localeCompare(b));
          else if (mode === 'len-desc') lines.sort((a,b) => b.length - a.length || a.localeCompare(b));
          else if (mode === 'shuffle') {
            for (let i = lines.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [lines[i], lines[j]] = [lines[j], lines[i]];
            }
          }
          document.getElementById('sort-output').value = lines.join('\n');
        }
        function copySorted() {
          const val = document.getElementById('sort-output').value;
          if (val) copyToClipboard(val, 'Sorted lines copied!');
        }
        
  </script>
</body>
</html>
