<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Compress and minify CSS code to reduce bundle size, or unminify and format CSS with indentation.">
  <link rel="canonical" href="https://shubhamshshaw.github.io/omniutil-suite/tools/css-minifier.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="CSS Minifier & Beautifier | OmniUtil">
  <meta property="og:description" content="Compress and minify CSS code to reduce bundle size, or unminify and format CSS with indentation.">
  <meta property="og:url" content="https://shubhamshshaw.github.io/omniutil-suite/tools/css-minifier.html">

  <!-- Google AdSense Verification & Auto ads script -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8836410103198896" crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>🎨 CSS Minifier & Beautifier</h1>
            <p class="tool-description">Compress and minify CSS code to reduce bundle size, or unminify and format CSS with indentation.</p>
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Input CSS</label>
          <textarea id="css-input" class="textarea-field" style="min-height:160px;font-family:'Fira Code',monospace;" placeholder="/* Paste CSS stylesheet here */\nbody {\n  margin: 0;\n  padding: 0;\n}"></textarea>
        </div>
        <div style="display:flex;gap:0.75rem;margin:1rem 0;flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="minifyCSS()">Minify CSS</button>
          <button class="btn btn-secondary" onclick="beautifyCSS()">Beautify / Format</button>
          <button class="btn btn-secondary" onclick="copyCSS()">Copy Result</button>
          <button class="btn btn-secondary" onclick="clearCSS()">Clear</button>
        </div>
        <div id="css-stats" style="margin-bottom:1rem;color:var(--text-secondary);font-size:0.85rem;"></div>
        <div class="form-group">
          <label class="form-label">Processed Output</label>
          <textarea id="css-output" class="textarea-field" style="min-height:160px;font-family:'Fira Code',monospace;" readonly></textarea>
        </div>
        
      </div>
      <aside>
        <div class="ad-unit ad-sidebar">
          <span class="ad-label">Advertisement</span>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="3000000016" data-ad-format="auto"></ins>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
      </aside>
    </div>
  </main>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved. Built for maximum speed, security, and responsive performance.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        function minifyCSS() {
          let css = document.getElementById('css-input').value;
          const origLen = css.length;
          css = css.replace(/\/\*[\s\S]*?\*\//g, '');
          css = css.replace(/\s*([\{\}\:\;\,])\s*/g, '$1');
          css = css.replace(/;\}/g, '}');
          css = css.replace(/\s+/g, ' ').trim();
          document.getElementById('css-output').value = css;
          const newLen = css.length;
          const saved = origLen > 0 ? (((origLen - newLen) / origLen) * 100).toFixed(1) : 0;
          document.getElementById('css-stats').textContent = `Original: ${origLen} bytes | Minified: ${newLen} bytes | Saved: ${saved}%`;
        }
        function beautifyCSS() {
          let css = document.getElementById('css-input').value;
          css = css.replace(/\/\*[\s\S]*?\*\//g, '');
          css = css.replace(/\s*([\{\}\:\;\,])\s*/g, '$1');
          css = css.replace(/\{/g, ' {\n  ');
          css = css.replace(/\;/g, ';\n  ');
          css = css.replace(/\n\s*\}/g, '\n}\n\n');
          css = css.replace(/\}\s*([^\}])/g, '}\n\n$1');
          css = css.trim();
          document.getElementById('css-output').value = css;
          document.getElementById('css-stats').textContent = `Formatted output: ${css.length} bytes`;
        }
        function copyCSS() {
          const val = document.getElementById('css-output').value;
          if (val) copyToClipboard(val, 'CSS copied to clipboard!');
        }
        function clearCSS() {
          document.getElementById('css-input').value = '';
          document.getElementById('css-output').value = '';
          document.getElementById('css-stats').textContent = '';
        }
        
  </script>
</body>
</html>
