<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Generate printable clean monthly calendars for any year and month with custom day schedules.">
  <link rel="canonical" href="https://shubhamshshaw.github.io/omniutil-suite/tools/calendar-generator.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Printable Monthly Calendar Generator | OmniUtil">
  <meta property="og:description" content="Generate printable clean monthly calendars for any year and month with custom day schedules.">
  <meta property="og:url" content="https://shubhamshshaw.github.io/omniutil-suite/tools/calendar-generator.html">

  <!-- Google AdSense Verification & Auto ads script -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8836410103198896" crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo"><div class="brand-icon">OU</div><span>OmniUtil</span></a>
      <div class="nav-controls">
        <button id="search-trigger" class="search-trigger"><span>🔍</span><span>Search tools...</span><span class="shortcut-badge">⌘K</span></button>
        <button id="theme-toggle" class="btn-icon">☀️</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tool-layout">
      <div class="tool-card">
        <div class="tool-header">
          <div class="tool-title-group">
            <h1>📆 Printable Monthly Calendar Generator</h1>
            <p class="tool-description">Generate printable clean monthly calendars for any year and month with custom day schedules.</p>
          </div>
        </div>
        
        <div style="display:flex;gap:1rem;margin-bottom:1.5rem;align-items:center;">
          <input type="month" id="cal-month" class="input-field" style="width:200px;" onchange="renderCalendar()">
          <button class="btn btn-primary" onclick="window.print()">🖨️ Print Calendar</button>
        </div>
        <div id="calendar-view" style="background:var(--bg-secondary);padding:1.5rem;border-radius:var(--radius-md);border:1px solid var(--card-border);"></div>
        
      </div>
      <aside>
        <div class="ad-unit ad-sidebar">
          <span class="ad-label">Advertisement</span>
          <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8836410103198896" data-ad-slot="3000000073" data-ad-format="auto"></ins>
          <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
      </aside>
    </div>
  </main>

  <div id="search-modal-overlay" class="modal-overlay">
    <div class="search-modal">
      <div class="search-input-wrapper"><span>🔍</span><input type="text" id="search-input" placeholder="Search utilities..."></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-bottom">&copy; 2026 OmniUtil. All rights reserved. Built for maximum speed, security, and responsive performance.</div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/ads-config.js"></script>
  <script>

        document.getElementById('cal-month').value = new Date().toISOString().slice(0, 7);
        function renderCalendar() {
          const val = document.getElementById('cal-month').value;
          const [yr, mo] = val.split('-').map(Number);
          const firstDay = new Date(yr, mo - 1, 1).getDay();
          const daysInMonth = new Date(yr, mo, 0).getDate();

          const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
          let html = `<h3 style="text-align:center;margin-bottom:1rem;">${new Date(yr, mo-1).toLocaleString('default', {month:'long'})} ${yr}</h3>`;
          html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;">';
          days.forEach(d => { html += `<div style="font-weight:700;color:var(--text-secondary);padding:6px;">${d}</div>`; });

          for (let i = 0; i < firstDay; i++) {
            html += '<div></div>';
          }
          for (let d = 1; d <= daysInMonth; d++) {
            html += `<div style="background:var(--bg-tertiary);border-radius:6px;padding:14px;border:1px solid var(--card-border);font-weight:600;">${d}</div>`;
          }
          html += '</div>';
          document.getElementById('calendar-view').innerHTML = html;
        }
        renderCalendar();
        
  </script>
</body>
</html>
